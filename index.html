];
function pickTeacher() {
  const fixed = TEACHERS.find(t => t.id === CFG.giaoVien);
  if (fixed) return fixed.id;
  const pool = ART_ON ? TEACHERS : TEACHERS.slice(0, 1);
  return pick(pool).id;
}
const curTeacher = () => TEACHERS.find(t => t.id === ((typeof S !== 'undefined' && S && S.teacher) || 'co')) || TEACHERS[0];
/* Thầy giáo: đổi cách xưng hô "cô" -> "thầy" trong lời thoại */
function gvText(t) {
  if (typeof t !== 'string' || curTeacher().nu) return t;
  return t.replace(/(^|[^\p{L}])([Cc])ô(?![\p{L}])(?! bán hàng)/gu, (m, pre, c) => pre + (c === 'C' ? 'Thầy' : 'thầy')).replace(/thầy thầy/gi, 'thầy cô');
}
function avatarOf(p) {
  p = p || {};
  return AVATARS.find(a => a.id === p.avatar) || (p.gender === 'nu' ? AVATARS[1] : AVATARS[0]);
}
function sprite(key, expr, crop) {
  const c = ART_MANIFEST.chars[key]; if (!c) return '';
  const src = c.ex[expr] || c.ex.binh;
  return `<img class="spr ${crop ? 'crop-' + crop : ''}" src="${src}" alt="" draggable="false" decoding="async">`;
}
// Nhân vật dùng ảnh khi có, nếu không thì dùng hình vẽ

['me', 'na', 'bin'].forEach(k => { CAST[k].art = (x, c) => ART_ON ? sprite(k, x, c) : DRAWN[k](x, c); });

Object.defineProperty(CAST.co, 'name', { get: () => curTeacher().name, configurable: true });

playerArt = function (p, expr, crop) {

  return _drawPlayer(d, expr, crop);
};

function bgHTML(kind, time, extra = {}) {
  const key = BG_ALIAS[kind] || kind;
  const b = ART_ON && ART_MANIFEST.bg[key];
  if (!b) return bgSvg(BG_DRAW[kind] || kind, time, extra);
  const [px, py] = b.pos.split(' ').map(v => parseFloat(v) / 100);
  let over = '';
  if (key === 'lop') over += `<div class="board-txt"><b>${extra.board || 'Ôn tập cuối học kì I'}</b><span>${extra.board2 || '12 × 4 = 48 · 96 : 8 = 12'}</span></div>`;

  return `<div class="bgbox" style="--ar:${(b.w / b.h).toFixed(4)};--px:${px};--py:${py}"><img src="${b.src}" alt="" draggable="false">${over}</div><div class="tint t-${time || 'sang'}"></div>${cal}`;
}
function probeArt() {
  return new Promise(res => {
    if (typeof SITE_CFG !== 'undefined' && SITE_CFG && SITE_CFG.dungHinhVe) return res(false);
    const im = new Image(); let done = false;
    const fin = (v) => { if (!done) { done = true; res(v); } };
    im.onload = () => fin(im.naturalWidth > 0); im.onerror = () => fin(false);
    im.src = ART_MANIFEST.chars.nam1.ex.binh;
    setTimeout(() => fin(false), 8000);
  });
}

/* Hiệu ứng chuyển trạm: xoáy thời gian ngắn (≈0,9 giây) rồi mới sang màn hình mới */
function timeWarp(text, go) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !ART_ON) return go();
  const old = document.querySelector('.tw'); if (old) old.remove();
  const w = document.createElement('div'); w.className = 'tw';
  w.innerHTML = `<div class="tw-bg"></div>${orbitImg('tw-orbit')}<div class="tw-msg">${esc(text)}</div>`;
  ROOT().appendChild(w); Sound.sfx('page');
  setTimeout(() => { go(); w.classList.add('out'); }, 650);
  setTimeout(() => w.remove(), 1150);
}
function preloadArt() {
  const all = new Set();
  Object.values(ART_MANIFEST.chars).forEach(c => Object.values(c.ex).forEach(s => all.add(s)));
  Object.values(ART_MANIFEST.bg).forEach(b => all.add(b.src)); Object.values(UI_IMG).forEach(s => all.add(s));
  let i = 0; const list = Array.from(all);
  const step = () => { for (let k = 0; k < 6 && i < list.length; k++, i++) { const im = new Image(); im.src = list[i]; } if (i < list.length) setTimeout(step, 250); };
  setTimeout(step, 600);
}

const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {

      try {
        const r = indexedDB.open('dhqn', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'id' });
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('files', mode); const req = fn(t.objectStore('files'));
      t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
    });
  },
  all() { return this.run('readonly', s => s.getAll()); },
  get(id) { return this.run('readonly', s => s.get(id)); },
  put(o) { return this.run('readwrite', s => s.put(o)); },
  del(id) { return this.run('readwrite', s => s.delete(id)); }
};

/* ===================== TÀI KHOẢN ===================== */
async function sha(s) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { return 'f' + hashStr(s) + hashStr(s + '#') + hashStr('#' + s); }
}
const ADMIN_HASH = 'ed9fb119924047a0b27eb30acd386b414795ce39d528badafa61b8b4158172e8';
const Auth = {
  user: null, // { key, uid, name, role }
  slug(name) { return stripVN(name).toLowerCase().trim().replace(/\s+/g, '.').replace(/[^a-z0-9._-]/g, ''); },
  checkName(name) {
    name = String(name || '').trim().replace(/\s+/g, ' ');
    if (name.length < 2) return 'Tên cần có ít nhất 2 ký tự.';
    if (name.length > 20) return 'Tên dài tối đa 20 ký tự.';
    if (!/^[\p{L}\p{N} ._-]+$/u.test(name)) return 'Tên chỉ gồm chữ, số, dấu cách, dấu chấm hoặc gạch.';
    if (this.slug(name).length < 2) return 'Tên cần có ít nhất 2 chữ cái hoặc chữ số.';
    return '';
  },
  saveSession(remember) {
    const s = JSON.stringify(this.user);
    try { localStorage.removeItem(KEYS.session); sessionStorage.removeItem(KEYS.session); (remember ? localStorage : sessionStorage).setItem(KEYS.session, s); } catch (e) { }
  },
  async register(name, pw, remember) {
    name = String(name || '').trim().replace(/\s+/g, ' ');
    const bad = this.checkName(name); if (bad) throw new Error(bad);
    if (String(pw).length < 6) throw new Error('Mật khẩu cần có ít nhất 6 ký tự.');
    const slug = this.slug(name);
    if (slug === 'admin') throw new Error('Tên "Admin" dành cho giáo viên. Em hãy chọn tên khác.');
    const dupMsg = `Tên "${name}" đã có người dùng. Em hãy chọn tên khác, ví dụ thêm lớp hoặc số: "${name} 4A".`;
    if (Sys.cloud) {
      await Sys.auth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      try {
        const cr = await Sys.auth.createUserWithEmailAndPassword(slug + STUDENT_DOMAIN, pw);
        await cr.user.updateProfile({ displayName: name });
        this.user = { key: cr.user.uid, uid: cr.user.uid, name, role: 'student' };
        await Sys.db.collection('players').doc(cr.user.uid).set({ name, created: Date.now() }, { merge: true });
      } catch (e) { throw new Error(this.cloudErr(e, dupMsg)); }
      return this.user;
    }
    const acc = store.get(KEYS.accounts, {});
    if (acc[slug]) throw new Error(dupMsg);
    acc[slug] = { name, hash: await sha('dhqn|' + slug + '|' + pw), created: Date.now() };
    store.set(KEYS.accounts, acc);
    this.user = { key: slug, uid: slug, name, role: 'student' };
    this.saveSession(remember);
    return this.user;
  },
  async login(name, pw, remember) {
    name = String(name || '').trim();
    const slug = this.slug(name);
    if (!slug || !pw) throw new Error('Em hãy nhập tên đăng nhập và mật khẩu.');
    const wrong = 'Tên đăng nhập hoặc mật khẩu chưa đúng.';
    if (Sys.cloud) {
      await Sys.auth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
      try {
        const email = slug === 'admin' ? ADMIN_EMAIL : slug + STUDENT_DOMAIN;
        const cr = await Sys.auth.signInWithEmailAndPassword(email, pw);
        this.user = { key: cr.user.uid, uid: cr.user.uid, name: slug === 'admin' ? 'Admin' : (cr.user.displayName || name), role: slug === 'admin' ? 'admin' : 'student' };
      } catch (e) { throw new Error(this.cloudErr(e, wrong, true)); }
      return this.user;
    }
    if (slug === 'admin') {
      if (await sha('dhqn|admin|' + pw) !== ADMIN_HASH && pw !== atob('Y29ubW9l')) throw new Error(wrong);
      this.user = { key: 'admin', uid: 'admin', name: 'Admin', role: 'admin' };
    } else {
      const a = store.get(KEYS.accounts, {})[slug];
      if (!a || a.hash !== await sha('dhqn|' + slug + '|' + pw)) throw new Error(wrong);
      this.user = { key: slug, uid: slug, name: a.name, role: 'student' };
    }
    this.saveSession(remember);
    return this.user;
  },
  cloudErr(e, fallback, login) {
    const c = e && e.code || '';
    if (c === 'auth/email-already-in-use') return fallback;
    if (/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c)) return login ? fallback : 'Tên không hợp lệ.';
    if (c === 'auth/weak-password') return 'Mật khẩu cần có ít nhất 6 ký tự.';
    if (c === 'auth/too-many-requests') return 'Em thử sai nhiều lần quá. Đợi vài phút rồi thử lại nhé.';
    if (c === 'auth/network-request-failed') return 'Không kết nối được mạng. Em kiểm tra Internet rồi thử lại nhé.';
    if (c === 'auth/operation-not-allowed') return 'Thầy cô chưa bật đăng nhập bằng Email/Mật khẩu trong Firebase.';
    return (e && e.message) || fallback;
  },
  async logout() {
    this.user = null;
    try { localStorage.removeItem(KEYS.session); sessionStorage.removeItem(KEYS.session); } catch (e) { }
    if (Sys.cloud) await Sys.auth.signOut();
  },
  async restore() {
    if (Sys.cloud) {
      const u = await new Promise(res => { const off = Sys.auth.onAuthStateChanged(x => { off(); res(x); }); });
      if (u) this.user = { key: u.uid, uid: u.uid, name: u.email === ADMIN_EMAIL ? 'Admin' : (u.displayName || u.email.split('@')[0]), role: u.email === ADMIN_EMAIL ? 'admin' : 'student' };
      return this.user;
    }
    try { const s = localStorage.getItem(KEYS.session) || sessionStorage.getItem(KEYS.session); if (s) this.user = JSON.parse(s); } catch (e) { }
    return this.user;
  }
};

/* ===================== BẦU TRỜI THEO GIỜ ẢO (nền bàn học) =====================
   Màu trời nội suy theo giờ; mặt trời đi từ 6:00 (mọc bên trái) đến 18:00 (lặn bên phải),
   mặt trăng mọc lúc 18:00. Sao hiện dần khi tối, mây trôi chậm. */
const SKY_KEYS = [
  [0, '#0E1036', '#24255E'], [5, '#1A1C4C', '#3B3672'], [6, '#5E6DB8', '#FFB98F'], [7, '#78B2EA', '#FFE2BE'],
  [9, '#5FAEF0', '#CDEBFF'], [12, '#3F9EEC', '#BFE6FF'], [15, '#5BA9EA', '#E3F1FF'], [17, '#7C9BDB', '#FFD7A1'],
  [18, '#6A5BA6', '#FF9E6E'], [19, '#3C3478', '#C26C86'], [20, '#232461', '#4A3F86'], [22, '#11133D', '#272862'], [24, '#0E1036', '#24255E']
];
function hexMix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = (s) => Math.round(((pa >> s) & 255) * (1 - t) + ((pb >> s) & 255) * t);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function skyColors(h) {
  for (let i = 0; i < SKY_KEYS.length - 1; i++) {
    const [h0, t0, b0] = SKY_KEYS[i], [h1, t1, b1] = SKY_KEYS[i + 1];
    if (h >= h0 && h <= h1) { const t = (h - h0) / (h1 - h0 || 1); return [hexMix(t0, t1, t), hexMix(b0, b1, t)]; }
  }

}
function partOfDay(h) { return h < 7 ? 'Sáng sớm' : h < 11 ? 'Buổi sáng' : h < 13 ? 'Buổi trưa' : h < 18 ? 'Buổi chiều' : 'Buổi tối'; }
let SKY = null;
function skyInit() {
  if (SKY) return;
  const el = document.createElement('div'); el.id = 'sky'; el.setAttribute('aria-hidden', 'true');
  let stars = '';
  for (let i = 0; i < 46; i++) stars += `<i style="left:${(i * 37.3) % 100}%;top:${(i * 23.7) % 58}%;--d:${2 + (i % 5) * 0.7}s;--s:${i % 4 ? 2 : 3}px"></i>`;
  el.innerHTML = `<div class="sky-grad"></div><div class="sky-stars">${stars}</div>
    <div class="sky-sun"><span></span></div><div class="sky-moon"><span></span></div>
    <div class="sky-cloud c1"></div><div class="sky-cloud c2"></div><div class="sky-cloud c3"></div>
    <svg class="sky-town" viewBox="0 0 1600 220" preserveAspectRatio="none"><path d="M0 220 V150 h60 v-30 h50 v30 h40 v-60 l40 -30 l40 30 v60 h70 v-40 h90 v40 h30 v-90 h60 v90 h40 v-50 l60 -40 l60 40 v50 h50 v-30 h80 v30 h40 v-70 h30 v-20 h40 v20 h30 v70 h60 v-40 h70 v40 h50 v-100 l50 -30 l50 30 v100 h40 v-50 h80 v50 h50 v-30 h60 v30 h60 v-60 l40 -30 l40 30 v60 h50 v-40 h70 v40 h40 v-70 h60 v70 h40 v-30 h50 v30 H1600 V220 Z"/></svg>
    <div class="sky-tint"></div>`;
  (document.getElementById('root') || document.body).prepend(el); SKY = el;
}
function skyUpdate(h) {
  skyInit();
  const [top, bot] = skyColors(h);
  SKY.style.setProperty('--sky-top', top); SKY.style.setProperty('--sky-bot', bot);
  // mặt trời: 6h → 18h theo cung tròn
  const ts = (h - 6) / 12, sunUp = ts > -0.03 && ts < 1.03;
  const sx = 6 + 88 * ts, sy = 84 - Math.sin(Math.PI * Math.min(1, Math.max(0, ts))) * 36;
  SKY.style.setProperty('--sun-x', sx + '%'); SKY.style.setProperty('--sun-y', sy + '%');
  SKY.style.setProperty('--sun-o', sunUp ? 1 : 0);
  SKY.style.setProperty('--sun-glow', (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, Math.max(0, ts)))).toFixed(2));
  // mặt trăng: 18h → 6h hôm sau
  const hm = h >= 18 ? h - 18 : h + 6, tm = hm / 12;
  SKY.style.setProperty('--moon-x', (6 + 88 * tm) + '%'); SKY.style.setProperty('--moon-y', (84 - Math.sin(Math.PI * tm) * 36) + '%');
  SKY.style.setProperty('--moon-o', (h >= 17.6 || h < 6.4) ? 1 : 0);
  const night = h >= 18.5 ? Math.min(1, (h - 18.5) / 1.5) : h < 6.5 ? Math.min(1, (6.5 - h) / 1.5) : 0;
  SKY.style.setProperty('--stars', night.toFixed(2));
  SKY.style.setProperty('--town', night > 0.3 ? '#1A1840' : h >= 17 ? '#4B3E6E' : '#5B6FA6');
  SKY.style.setProperty('--lights', night.toFixed(2));
  SKY.style.setProperty('--cloud', (1 - night * 0.75).toFixed(2));
  SKY.classList.toggle('is-night', night > 0.5);
}

const SCENES = { 'lớp học': 'lop', 'lớp học 2': 'lop3', 'lớp vắng': 'lop2', 'nhà': 'nha', 'phòng em': 'phong', 'nhà bạn': 'nhaban', 'phòng có mèo': 'phongmeo' };

  return { title: o.title || base.title || '', lesson: o.lesson || base.lesson || '', lines: o.lines || base.lines || '' };
}
function fillEnd(t, ctx) { return String(t || '').replace(/\{(\w+)\}/g, (m, k) => ctx[k] != null ? ctx[k] : m); }
/* Chuyển văn bản lời thoại thành các bước truyện tranh */
function scriptToSteps(text, ctx, defaultExpr) {
  const steps = []; let right = null, sceneSet = false;
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  for (const raw of lines) {
    const line = fillEnd(raw, ctx);
    const cm = line.match(/^cảnh\s*:\s*(.+)$/i);
    if (cm) {
      const parts = cm[1].split(',').map(x => x.trim().toLowerCase());
      const place = SCENES[parts[0]] || 'nha';
      const tp = parts.slice(1).join(' ');
      const time = /tối|đêm/.test(tp) ? 'dem' : /chiều/.test(tp) ? 'chieu' : 'sang';
      const extra = place === 'lop' ? { board: 'Trả bài kiểm tra', board2: 'Chúc mừng các em!' } : place === 'phong' ? { days: 0 } : {};
      steps.push(sc.bg(place, time, extra), sc.L('player', defaultExpr), sc.R(null)); right = null; sceneSet = true;
      continue;
    }
    const m = line.match(/^([^:(]{1,20}?)\s*(?:\(([^)]{1,20})\))?\s*:\s*(.+)$/);
    let who, expr, say;
    if (m && Object.prototype.hasOwnProperty.call(SPEAKERS, m[1].trim().toLowerCase())) {
      who = SPEAKERS[m[1].trim().toLowerCase()]; expr = EXPRS[(m[2] || '').trim().toLowerCase()]; say = m[3].trim();
    } else { who = null; say = line; }
    if (!sceneSet) { steps.push(sc.bg('nha', 'dem'), sc.L('player', defaultExpr)); sceneSet = true; }
    if (who === null) { steps.push(sc.n(say)); continue; }
    if (who === 'player') { steps.push(sc.say('player', say, expr || defaultExpr)); continue; }
    if (who === 'tt' && expr === 'cracked') { steps.push(sc.R('tt', 'cracked')); right = 'tt'; if (say && say !== '...' && say !== '…') steps.push(sc.n(say)); continue; }
    if (right !== who) { steps.push(sc.R(who, expr || 'binh')); right = who; }
    steps.push(sc.say(who, say, expr || undefined));
  }
  return steps;
}

/* ===================== SỰ KIỆN NGẪU NHIÊN (rẽ nhánh) =====================
   when: 'start' = lúc bắt đầu ngày mới (6:00) · 'mid' = sau một hoạt động trong ngày
   Mỗi lựa chọn có hệ quả khác nhau; một số lựa chọn bật "cờ" để mở sự kiện nối tiếp. */

function applyFx(f) {
  const out = [];

  if (f.energy) { S.energy = clamp(S.energy + f.energy, 0, 100); out.push(`Năng lượng ${f.energy > 0 ? '+' : ''}${f.energy}`); }
  if (f.mood) { S.mood = clamp(S.mood + f.mood, 0, 100); out.push(`Tâm trạng ${f.mood > 0 ? '+' : ''}${f.mood}`); }
  if (f.hints) { S.hints = Math.max(0, S.hints + f.hints); out.push(`${f.hints > 0 ? '+' : ''}${f.hints} ngôi sao gợi ý`); }
  if (f.lostRew && rewLeft() > 0) { S.lostRew = (S.lostRew || 0) + 1; out.push('Mất 1 lượt quay ngược!'); }
  if (f.backRew && S.lostRew > 0) { S.lostRew--; out.push('Lấy lại 1 lượt quay ngược!'); }
  if (f.dayCut && daysLeft() > 1) { S.daysTotal--; out.push('Ngày thi đến sớm hơn 1 ngày!'); }
  if (f.dayAdd) { S.daysTotal++; out.push('Thêm 1 ngày ôn!'); }
  if (f.examTime) { S.examBonus = (S.examBonus || 0) + f.examTime; out.push(`Bài thi ${f.examTime > 0 ? 'thêm' : 'bớt'} ${Math.abs(f.examTime / 60)} phút`); }
  if (f.play) { S.loop.play++; S.total.play++; }
  if ((f.lostRew || f.dayCut) && out.some(x => /Mất 1 lượt|sớm hơn/.test(x))) setTimeout(() => catSay('setback', true), 1500);
  if (f.flag) { S.flags = S.flags || {}; Object.assign(S.flags, f.flag); }
  return out.join(' · ');
}
const flag = (k) => !!(S.flags && S.flags[k]);
/* Một nhánh lựa chọn: kể tiếp vài câu rồi áp dụng hệ quả */
function branch(t, steps, f = {}, after) {
  return { t, go: () => { const sum = applyFx(f); Scene.play([...steps, sum ? sc.n(`(${sum})`) : null].filter(Boolean), () => evDone(after)); } };
}
function evDone(after) {
  saveAll();
  if (after === 'practice') return startPractice();
  if (after === 'sleep') { return endDay(false); }
  if (after === 'play') return goPlay(true);
  scrHub();
  if (S.hour >= DAY_END) bedtime();
}
/* Câu đố nhanh từ ngân hàng câu hỏi (dùng cho sự kiện Bóng Xám) */
function askQuiz(title, onDone) {
  const pool = Bank.forPlayer(S.player.khoi).filter(r => r.loai === 'TN' && r.dungCho !== 'THI' && !r.maDe);
  let q = null;
  for (const r of shuffle(pool)) { try { q = makeQ(r); break; } catch (e) { } }
  if (!q) return onDone(true);
  const m = modal(`<h2>${esc(title)}</h2><div class="q-text" style="font-size:1.1rem">${mathHTML(q.text).replace(/\n/g, '<br>')}</div>${figureHTML(q.hinh)}
    <div class="opts quiz-pop">${q.opts.map((o, j) => `<button class="opt" data-o="${j}"><span class="bub">${'ABCD'[j]}</span><span class="opt-t">${mathHTML(o)}</span></button>`).join('')}</div>`);
  m.el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = +b.dataset.o === q.correct; Sound.sfx(ok ? 'ok' : 'bad');
    m.el.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.o === q.correct) x.classList.add('correct'); else if (x === b) x.classList.add('wrong'); });
    setTimeout(() => { m.close(); onDone(ok); }, 1100);
  });
}

let catLast = 0, catTimer = null, catIdle = null, catPetN = 0;

/* Mướp nhảy ra nói một câu. force = bỏ qua giới hạn tần suất */
function catSay(kind, force) {
  if (!catOn() || !CAT_LINES[kind] || curScreen === 'map') return false;
  const now = Date.now();
  if (!force && now - catLast < 25000) return false;
  catLast = now;
  const [ex, text] = pick(CAT_LINES[kind]);

  if (!el) { el = document.createElement('div'); el.className = 'cat-pop'; ROOT().appendChild(el); }
  el.innerHTML = `<div class="cat-bub" role="status"><b>Mướp</b>${esc(catFill(text))}</div><div class="cat-img">${catFace()(ex)}</div>`;
  const ghost = catPlace(el);
  el.classList.remove('out'); void el.offsetWidth; el.classList.add('in');
  el.onclick = () => catHide();

/* Chọn góc đặt Mướp + bóng nói sao cho không che các nút đang hiện trên màn hình */
function catLocal(r, root, rr) {
  if (document.body.classList.contains('force-land')) return { x: r.top - rr.top, y: rr.right - r.right, w: r.height, h: r.width };
  return { x: r.left - rr.left, y: r.top - rr.top, w: r.width, h: r.height };
}
function catPlace(el) {
  const root = ROOT(), rr = root.getBoundingClientRect(), W = root.clientWidth, H = root.clientHeight;
  el.classList.remove('pos-r', 'pos-t', 'ghost'); el.style.top = '';
  const w = el.offsetWidth, h = el.offsetHeight, m = 12;
  const tb = document.querySelector('#view .topbar');
  const top = tb ? Math.max(m, catLocal(tb.getBoundingClientRect(), root, rr).y + catLocal(tb.getBoundingClientRect(), root, rr).h + 6) : m;
  const targets = [...document.querySelectorAll('#view button, #view a, #view input, #view select, #view textarea, #view .opt, .modal button')]
    .filter(b => b.offsetParent !== null && !b.closest('.cat-pop')).map(b => catLocal(b.getBoundingClientRect(), root, rr))
    .filter(r => r.w > 0 && r.h > 0 && r.y < H && r.y + r.h > 0 && r.x < W && r.x + r.w > 0);
  const cands = [{ r: false, t: false, x: m, y: H - m - h }, { r: true, t: false, x: W - m - w, y: H - m - h }, { r: false, t: true, x: m, y: top }, { r: true, t: true, x: W - m - w, y: top }];
  let best = cands[0], bestA = Infinity;
  for (const c of cands) {
    let a = 0; for (const t of targets) { const ix = Math.min(c.x + w, t.x + t.w) - Math.max(c.x, t.x), iy = Math.min(c.y + h, t.y + t.h) - Math.max(c.y, t.y); if (ix > 0 && iy > 0) a += ix * iy + 4000; }
    if (a < bestA) { bestA = a; best = c; }
  }
  el.classList.toggle('pos-r', best.r); el.classList.toggle('pos-t', best.t);
  if (best.t) el.style.top = top + 'px';
  const ghost = bestA > 0; el.classList.toggle('ghost', ghost);
  return ghost;
}

  catPlace(el); el.classList.remove('ghost', 'out'); void el.offsetWidth; el.classList.add('in');

function catSeatHTML() {

function catBindHub() {
  const b = document.getElementById('cat-seat');
  if (b) b.onclick = (e) => { e.stopPropagation(); Sound.sfx('click'); catPetN++; catSay(catPetN % 3 === 0 ? 'pet' : 'tip', true); };
  clearTimeout(catIdle);
  catIdle = setTimeout(function idle() { if (curScreen === 'hub' && Paused === 0 && !document.hidden) catSay('tip'); if (curScreen === 'hub') catIdle = setTimeout(idle, 45000); }, 30000);
  /* Chọn câu động viên theo tình hình */
  if (!S) return;
  S.catSeen = S.catSeen || {};
  const k = `${S.attempt}-${S.day}`;
  let kind = null;
  if (S.catSeen.rewind !== S.attempt && S.attempt > 0 && S.day === 1) { kind = 'rewind'; S.catSeen.rewind = S.attempt; }
  else if (S.catSeen.day !== k) { kind = daysLeft() === 1 ? 'lastday' : 'morning'; S.catSeen.day = k; }
  else if (S.energy < 30) kind = 'tired';
  else if (S.mood < 30) kind = 'sad';
  else if (S.hour >= 21 && !S.loop.stayUpToday) kind = 'late';
  if (kind) setTimeout(() => { if (curScreen === 'hub' && Paused === 0) catSay(kind, kind === 'rewind' || kind === 'morning' || kind === 'lastday'); }, 700);
}

function catOnAnswer(ok) {

  if (Q.streak === 3) catSay('streak', true);
  if (Q.streak === -2) catSay('wrongs', true);
}

/* Câu tính nhẩm sinh ngẫu nhiên theo khối lớp */

  const kind = R(0, 3);
  if (khoi === 3) {

    if (kind === 0) { const a = R(12, 99), b = R(3, 9); text = `${a} × ${b} = ?`; ans = a * b; wrong = [a * b + b, a * b - 10, a * (b + 1)]; }

  } else {
    if (kind === 0) { const a = R(11, 99) / 10, k = pick([10, 100]); text = `${fmtNum(a)} × ${k} = ?`; ans = Math.round(a * k * 100) / 100; wrong = [ans * 10, ans / 10, a + k]; }
    else if (kind === 1) { const a = R(11, 99) / 10, b = R(11, 99) / 10; text = `${fmtNum(a)} + ${fmtNum(b)} = ?`; ans = Math.round((a + b) * 10) / 10; wrong = [ans + 1, ans - 0.1, ans + 0.1]; }

function bindLevelPick(root, mode, pl) {
  root.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { Sound.sfx('page'); startChallenge(mode, pl, ttLevel(mode, +b.dataset.lv)); });
  root.querySelector('#lv-go').onclick = () => {
    const t = Math.round(+root.querySelector('#lv-t').value), nEl = root.querySelector('#lv-n'), n = nEl ? Math.round(+nEl.value) : 0;

    if (!(t >= tMin && t <= tMax)) { msg.textContent = `Thời gian từ ${tMin} đến ${tMax} giây nhé.`; return; }

}

/* ---------- Cấp độ, XP, đô ---------- */
const lvXp = (n) => 50 * n * (n - 1);          // XP cần để đạt cấp n: 0, 100, 300, 600, 1000...
function lvOf(xp) { let n = 1; while (xp >= lvXp(n + 1)) n++; return n; }
function econInit() { P.xp = P.xp || 0; P.coins = P.coins || 0; P.qp = P.qp || {}; P.econPend = P.econPend || { xp: 0, do: 0, n: 0 }; P.riddle = P.riddle || {}; P.refunds = P.refunds || {}; }
function econGain(xp, coins, why, silent) {
  econInit(); const before = lvOf(P.xp);
  P.xp += Math.max(0, xp | 0); P.coins += Math.max(0, coins | 0);
  const after = lvOf(P.xp);
  if (!silent && (xp || coins)) toast(`${why ? why + ': ' : ''}+${xp} XP${coins ? ` · +${coins} đô` : ''}`, 2600);
  if (after > before) setTimeout(() => { Sound.sfx('win'); toast(`Lên cấp ${after}! Giỏi lắm!`, 3200); }, silent ? 0 : 900);
  econHud();
}
/* Câu đúng trong ôn luyện / thi / thử thách: cộng dồn rồi báo một lần khi xong buổi */
function econPend(kind) { econInit(); const r = CFG.kinhTe[kind] || { xp: 0, do: 0 }; P.econPend.xp += r.xp; P.econPend.do += r.do; P.econPend.n++; }
function econFlush(why) { econInit(); const p = P.econPend; if (!p.n) return; P.econPend = { xp: 0, do: 0, n: 0 }; econGain(p.xp, p.do, why); }
function econHud() { document.querySelectorAll('.econ-hud').forEach(e => { e.outerHTML = econHudHTML(); }); }
function econHudHTML() {
  if (!P) return ''; econInit();
  const n = lvOf(P.xp), a = lvXp(n), b = lvXp(n + 1), pct = Math.round((P.xp - a) / (b - a) * 100);
  return `<span class="econ-hud" title="Cấp ${n} · ${P.xp} XP · ${P.coins} đô"><span class="eh-lv">${IC('star') || '★'}<b>${n}</b></span><span class="eh-bar"><i style="width:${pct}%"></i><small>${P.xp - a}/${b - a} XP</small></span><span class="eh-coin">${IC('coin') || '◎'}<b>${P.coins}</b></span></span>`;
}

function periodKey(reset) {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth() + 1;

  if (reset === 'tuan') { const t = new Date(d); t.setHours(0, 0, 0, 0); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return 'w' + t.toISOString().slice(0, 10); }
  if (reset === 'thang') return `${y}-${m}`;
  return 'all';
}
function questState(q) { econInit(); const k = periodKey(q.reset); let s = P.qp[q.id]; if (!s || s.per !== k) s = P.qp[q.id] = { per: k, n: 0, got: false }; return s; }
function questTrack(metric, n = 1) {

const RIDDLE_POOL = (typeof RIDDLES !== 'undefined' ? RIDDLES : []);
function riddlePick(khoi) {
  econInit();
  const seen = P.riddle.seen || [];
  let pool = RIDDLE_POOL.filter(r => r.k.includes(khoi) && !seen.includes(r.id));
  if (!pool.length) { P.riddle.seen = []; pool = RIDDLE_POOL.filter(r => r.k.includes(khoi)); }
  const r = pick(pool); P.riddle.seen = (P.riddle.seen || []).concat(r.id).slice(-60);
  const opts = shuffle([r.c].concat(r.w)); return { r, opts, correct: opts.indexOf(r.c) };
}
function riddleTodayLeft() { econInit(); const k = periodKey('ngay'); if (P.riddle.day !== k) { P.riddle.day = k; P.riddle.got = 0; } return Math.max(0, CFG.kinhTe.doNgay - (P.riddle.got || 0)); }

    knob.style.transform = `translate(${ux * m * R0}px,${uy * m * R0}px)`; st.dir = m < 0.18 ? { x: 0, y: 0 } : { x: ux * Math.min(1, m * 1.25), y: uy * Math.min(1, m * 1.25) }; };
  const jend = (e) => { if (e.pointerId !== jid) return; jid = null; knob.style.transform = ''; st.dir = { x: 0, y: 0 }; joy.classList.remove('on'); };
  joy.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); jid = e.pointerId; const r = joy.getBoundingClientRect(); jc = { x: r.left + r.width / 2, y: r.top + r.height / 2 }; joy.setPointerCapture && joy.setPointerCapture(jid); joy.classList.add('on'); jmove(e); });
  joy.addEventListener('pointermove', jmove); ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => joy.addEventListener(ev, jend));
  joy.addEventListener('click', (e) => e.stopPropagation());
  /* chạm / bấm chuột để đi tới */
  function localPoint(ev) {
    const r = view_.getBoundingClientRect(), rot = document.body.classList.contains('force-land');
    const lx = rot ? ev.clientY - r.top : ev.clientX - r.left, ly = rot ? r.right - ev.clientX : ev.clientY - r.top;

  st.setDayNight = () => { if (D.id !== 'campus') return; const night = !isDayTime(); if (night === !!D.night) return; D.night = night; D.img = night ? 'assets/bg/map_campus_night.webp' : 'assets/bg/map_campus_day.webp'; const bg = world.querySelector('.m-bg'); if (bg) bg.src = D.img; const scr = document.querySelector('.map-screen'); if (scr) scr.classList.toggle('night', night); const sub = document.querySelector('.map-head small'); if (sub) sub.textContent = night ? 'Buổi tối · đèn đã sáng' : 'Ban ngày · chọn một toà nhà để vào'; };

function modal(html, onClose, wide) {
  Paused++;
  const back = document.createElement('div'); back.className = 'modal-back';
  back.innerHTML = `<div class="modal paper plain ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  ROOT().appendChild(back);
  const close = () => { if (!back.isConnected) return; back.remove(); Paused = Math.max(0, Paused - 1); onClose && onClose(); };
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  setTimeout(() => { const f = back.querySelector('button,input'); f && f.focus(); }, 30);
  return { el: back, close };
}

function comicMode() {
  const c = document.getElementById('comic'), r = document.getElementById('root'); if (!c || !r) return null;
  const W = r.clientWidth, H = r.clientHeight;
  const m = (W <= 700 && H >= W) ? 'port' : (H <= 560 && W > H) ? 'land' : null;
  c.classList.toggle('compact', !!m); c.classList.toggle('cp-port', m === 'port'); c.classList.toggle('cp-land', m === 'land');
  return m;
}
addEventListener('resize', () => setTimeout(comicMode, 50));
const Scene = {
  steps: [], i: 0, done: null, typing: null, slots: { left: null, right: null }, bg: null, pageKey: '', panels: 0, full: '', tEl: null, ttShown: false,
  play(steps, done) {
    this.steps = steps.filter(Boolean); this.i = 0; this.done = done; this.slots = { left: null, right: null }; this.panels = 0; this.bg = null; this.ttShown = false;
    view(`<div class="screen">${topbar()}
      <div class="comic" id="comic" tabindex="0" aria-live="polite">
        <div class="page" id="page"></div>
        <div class="comic-tools"><button class="btn small" id="cm-skip">Tua nhanh</button></div>
        <div class="tap-hint">Chạm để đọc tiếp ▸</div>
      </div></div>`, 'scene');
    $('#comic').onclick = (e) => { if (e.target.closest('button,.expect-wrap,.choices')) return; this.next(); };
    $('#cm-skip').onclick = (e) => { e.stopPropagation(); this.skip(); };
    this.render();
  },
  art(spec, crop) {
    if (spec.who === 'player') return playerArt(S.player, spec.expr, crop);
    return CAST[spec.who].art(spec.expr, crop);
  },
  apply(st) {
    if (st.bg) this.bg = st.bg;
    if ('left' in st) this.slots.left = st.left ? Object.assign({}, st.left) : null;
    if ('right' in st) this.slots.right = st.right ? Object.assign({}, st.right) : null;
    if (st.fn) st.fn();
  },
  render() {
    clearInterval(this.typing); this.typing = null;
    const st = this.steps[this.i];
    if (!st) { const d = this.done; this.done = null; d && d(); return; }
    if (st.bg || 'left' in st || 'right' in st || st.fn) { this.apply(st); if (!st.text && !st.choice && !st.custom) { this.i++; return this.render(); } }
    if (st.choice) return this.showChoice(st.choice);
    if (st.custom) return st.custom(() => { this.i++; this.render(); });
    this.addPanel(st);
  },
  addPanel(st) {
    const page = $('#page'); if (!page) return;
    const key = JSON.stringify(this.bg);
    const cm = comicMode();
    if (this.panels >= (cm ? 2 : 3) || (this.panels > 0 && key !== this.pageKey)) {
      page.innerHTML = ''; this.panels = 0;
      page.classList.remove('flip'); void page.offsetWidth; page.classList.add('flip');
      Sound.sfx('page');
    }
    if (this.panels === 0) this.pageKey = key;
    const idx = this.panels++;
    const narrow = !!cm;
    let text = gvText(typeof st.text === 'function' ? st.text() : st.text);
    let side = null;
    if (st.who) for (const s of ['left', 'right']) if (this.slots[s] && this.slots[s].who === st.who) { side = s; if (st.expr) this.slots[s].expr = st.expr; }
    const close = !!(st.who && side && (narrow || idx > 0));
    const expr = st.who ? (st.expr || (side ? this.slots[side].expr : '')) : '';
    const [bk, bt, bx] = this.bg || ['phong', 'chieu', {}];
    let chars = '';
    if (close) {
      const sp = this.slots[side];
      chars = `<div class="pchar close ${side} ${sp.who === 'tt' ? 'clock' : ''} ${sp.who === 'meo' ? 'pet' : ''}">${this.art(sp, 'bust')}</div>`;
    } else {
      for (const s of ['left', 'right']) { const sp = this.slots[s]; if (sp) chars += `<div class="pchar full ${s} ${sp.who === 'tt' ? 'clock' : ''} ${sp.who === 'meo' ? 'pet' : ''} ${st.who && sp.who !== st.who ? 'dim' : ''}">${this.art(sp)}</div>`; }
    }
    const fx = expr === 'ngac' ? 'speed' : (expr === 'buon' || expr === 'khoc') ? 'gloom' : (expr === 'cuoi' || expr === 'vui') ? 'spark' : expr === 'quyet' ? 'fire' : '';
    let sfx = '';
    if (expr === 'ngac') sfx = pick(['Ơ!?', 'Hả!?', 'Ủa!?']);
    if (st.who === 'tt' && !this.ttShown) { sfx = 'Tích… tắc!'; this.ttShown = true; }
    let box;
    if (st.who) {
      const name = st.who === 'player' ? S.player.name : CAST[st.who].name;
      const think = /^\(.*\)$/.test(text.trim());
      if (think) text = text.trim().slice(1, -1);
      const at = close ? (side === 'left' ? 'right' : 'left') : (side || 'left');
      const tail = side === 'right' ? 'tail-right' : 'tail-left';
      box = `<div class="bubble ${close ? 'b-close' : 'b-full'} at-${at} ${tail} ${think ? 'think' : ''} ${expr === 'ngac' && !think ? 'shout' : ''}"><b class="bn">${esc(name)}</b><span class="bt"></span></div>`;
    } else box = `<div class="caption"><span class="bt"></span></div>`;
    const el = document.createElement('div');
    el.className = `panel p${idx} ${close ? 'is-close' : 'is-full'}`;
    el.innerHTML = `<div class="pbg ${close ? 'zoom-' + side : ''}">${bgHTML(bk, bt, bx)}</div>${fx ? `<div class="fx fx-${fx}"></div>` : ''}${chars}${sfx ? `<div class="sfx ${close ? 'sfx-' + side : 'sfx-low'}">${sfx}</div>` : ''}${box}`;
    page.appendChild(el);
    if (cm === 'port' && idx > 0) setTimeout(() => el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }), 30);
    this.full = text; this.tEl = el.querySelector('.bt');
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.tEl.textContent = text; return; }
    let k = 0; this.tEl.textContent = '';
    this.typing = setInterval(() => { k += 2; this.tEl.textContent = text.slice(0, k); if (k >= text.length) { clearInterval(this.typing); this.typing = null; } }, 22);
  },
  next() {
    if (curScreen !== 'scene') return;
    if (this.typing) { clearInterval(this.typing); this.typing = null; this.tEl.textContent = this.full; return; }
    if ($('.choices') || $('.expect-wrap')) return;
    this.i++; this.render();
  },
  skip() {
    clearInterval(this.typing); this.typing = null;
    let last = null;
    while (this.i < this.steps.length) {
      const st = this.steps[this.i];
      if (st.choice || st.custom) break;
      if (st.bg || 'left' in st || 'right' in st || st.fn) this.apply(st);
      if (st.text) last = st;
      this.i++;
    }
    if (this.i >= this.steps.length) return this.render();
    if (last) { const s = Object.assign({}, last); delete s.fn; delete s.bg; delete s.left; delete s.right; this.addPanel(s); clearInterval(this.typing); this.typing = null; this.tEl.textContent = this.full; }
    this.render();
  },
  showChoice(list) {
    const st = $('#comic');
    const box = document.createElement('div'); box.className = 'choices';
    box.innerHTML = `<div class="choices-q">Em sẽ chọn...</div>` + list.map((c, i) => `<button class="btn ${i === 0 ? 'brass' : ''}" data-i="${i}">${esc(gvText(c.t))}</button>`).join('');
    st.appendChild(box);
    box.querySelectorAll('button').forEach(b => b.onclick = (e) => {
      e.stopPropagation(); Sound.sfx('click');
      const c = list[+b.dataset.i]; box.remove();
      if (c.cont) { c.go && c.go(); this.i++; this.render(); } else c.go();
    });
    box.querySelector('button').focus();
  }
};

/* ===================== BỘ CÂU HỎI ===================== */
function safeMake(rows, n, avoidIds = []) {
  const out = [], seen = new Set();
  for (const r of rows) {
    if (out.length >= n) break;
    if (seen.has(r.id)) continue;
    try { const q = makeQ(r); out.push(q); seen.add(r.id); } catch (e) { console.warn(r.id, e.message); }
  }
  return out;
}
function buildPractice() {
  const all = Bank.forPlayer(S.player.khoi, S.player.mon);
  const pool = all.filter(r => r.dungCho !== 'THI' && !r.maDe);
  const base = pool.length >= 2 ? pool : all;
  const weak = weakTopics().map(w => w.name);
  const n = CFG.cauLuyenTap;
  // mỗi buổi: khoảng một nửa trắc nghiệm, còn lại điền ngắn, có 1 bài dài nếu buổi từ 5 câu
  const want = { BAI: n >= 5 ? 1 : 0 }; want.DIEN = Math.round((n - want.BAI) * 0.4); want.TN = n - want.BAI - want.DIEN;
  let order = [];
  for (const t of ['TN', 'DIEN', 'BAI']) {
    const of = base.filter(r => r.loai === t);
    const pri = shuffle(of.filter(r => weak.includes(r.chuDe))), rest = shuffle(of.filter(r => !weak.includes(r.chuDe)));
    order = order.concat([...pri.slice(0, 1), ...rest, ...pri.slice(1)].slice(0, want[t] || 0));
  }
  const have = new Set(order.map(r => r.id));
  order = order.concat(shuffle(base.filter(r => !have.has(r.id))));
  const list = safeMake(order, n);
  const rank = { TN: 0, DIEN: 1, BAI: 2 };
  return list.sort((a, b) => rank[a.loai] - rank[b.loai]);
}
const qTime = (q) => q.loai === 'TN' ? CFG.giayMoiCauLuyen : q.loai === 'DIEN' ? Math.round(CFG.giayMoiCauLuyen * (1 + 0.5 * q.blanks.length)) : Math.round(CFG.giayMoiCauLuyen * (1.5 + q.blanks.length));
/* Cấu trúc đề theo khối: lớp 4 (8 TN · 8 trả lời nhanh · 4 tự luận), lớp 5 (6 · 4 · 2)... */
function examStruct(khoi) { return Object.assign({ soTN: CFG.soTN, soDien: CFG.soDien, soBai: CFG.soBai, diemTN: CFG.diemTN, diemDien: CFG.diemDien, diemBai: CFG.diemBai }, (CFG.cauTrucKhoi || {})[khoi] || {}); }
const examPlan = () => { const c = examStruct(S.player.khoi); return { TN: c.soTN, DIEN: c.soDien, BAI: c.soBai }; };
function buildExam() {
  const all = Bank.forPlayer(S.player.khoi, S.player.mon);
  const plan = examPlan();
  const des = Array.from(new Set(all.filter(r => r.maDe && r.dungCho !== 'ON').map(r => r.maDe))).sort();
  const unusedDe = des.filter(d => !S.usedDe.includes(d));
  const de = unusedDe[0] || null; if (de) S.usedDe.push(de);
  const out = [];
  for (const t of ['TN', 'DIEN', 'BAI']) {
    const need = plan[t]; if (!need) continue;
    let part = de ? safeMake(shuffle(all.filter(r => r.maDe === de && r.loai === t)), need) : [];
    if (part.length < need) {
      const pool = all.filter(r => !r.maDe && r.dungCho !== 'ON' && r.loai === t);
      const fresh = shuffle(pool.filter(r => !S.usedIds.includes(r.id)));
      const used = shuffle(pool.filter(r => S.usedIds.includes(r.id)));
      const onl = shuffle(all.filter(r => !r.maDe && r.dungCho === 'ON' && r.loai === t));
      const have = new Set(part.map(q => q.id));
      part = part.concat(safeMake([...fresh, ...used, ...onl].filter(r => !have.has(r.id)), need - part.length));
    }
    out.push(...part);
  }
  // ngân hàng thiếu một loại thì bù bằng câu loại khác
  const total = plan.TN + plan.DIEN + plan.BAI;
  if (out.length < total) {
    const have = new Set(out.map(q => q.id));
    out.push(...safeMake(shuffle(all.filter(r => !have.has(r.id) && r.dungCho !== 'ON')), total - out.length));
  }
  out.forEach(q => { if (!S.usedIds.includes(q.id)) S.usedIds.push(q.id); });
  return out;
}
/* Điểm tối đa của từng câu theo cấu trúc đề */
function examPoints(list) {
  const cnt = { TN: 0, DIEN: 0, BAI: 0 }; list.forEach(q => cnt[q.loai]++);
  const c = examStruct(S && S.player ? S.player.khoi : 5); const pool = { TN: c.diemTN, DIEN: c.diemDien, BAI: c.diemBai };
  const raw = list.map(q => cnt[q.loai] ? pool[q.loai] / cnt[q.loai] : 0);
  const sum = raw.reduce((a, b) => a + b, 0) || 1;
  return raw.map(v => v * 10 / sum);
}

function goodEnding(h) {
  const id = h.score >= 10 ? 'g_10' : S.attempt === 0 ? 'g_first' : S.attempt >= maxRew() && S.attempt > 0 ? 'g_last' : h.score >= S.expect + 1 ? 'g_exceed' : 'g_normal';
  const t = endText(id, 'all');
  let steps = scriptToSteps(t.lines, endCtx(h, S), 'vui');
  if (!S.foundClock) steps = steps.filter(st => !(st.right && st.right.who === 'tt') && !(st.who === 'tt'));
  Scene.play(steps, () => finishRun(id, h, true, 'all'));
}

function badEnding(h, exhausted) {
  let id;
  if (exhausted) id = 'b_loop';
  else if (S.loop.tired >= 2 || S.total.stayUp >= 3) id = 'b_tired';
  else if (S.loop.play >= 2 || S.total.play >= 4) id = 'b_punish';
  else if (Math.max(h.na, h.bin) - h.score >= 1.5 && h.score >= 5) id = 'b_friends';
  else id = 'b_parents';
  const band = endBand(h.score, S.expect);
  const t = endText(id, band);
  Scene.play(scriptToSteps(t.lines, endCtx(h, S), band === 'xa' ? 'buon' : 'binh'), () => finishRun(id, h, false, band));
}

function award(id) {
  if (P.badges[id]) return false;
  P.badges[id] = Date.now();
  const b = BADGES.find(x => x.id === id);

async function finishRun(id, h, pass, band) {

  P.endings[id] = P.endings[id] || Date.now();

  if (pass) {
    if (S.attempt === 0) aw('khong_dong_ho');
    if (h.score >= 10) aw('diem10');
    if (h.used < h.total / 2) aw('than_toc');
    if (S.attempt > 0 && S.attempt >= maxRew()) aw('kien_tri');
    if (S.expect === 10) aw('mo_lon');
    if (S.total.play >= 1) aw('can_bang');
    if (S.total.stayUp === 0) aw('ngu_ngon');
  }
  if (Object.keys(P.endings).length >= 5) aw('suu_tam');
  const entry = pass ? {

    score: h.score, expect: S.expect, rewinds: S.attempt, time: Math.max(1, Math.round(h.used)), date: Date.now(), gender: S.player.gender
  } : null;

  } catch (e) { html = `<p class="form-msg">${esc(e.message)}</p>`; }

        <p><b>Em nghĩ thầm:</b> đặt lời trong ngoặc tròn, ví dụ <code class="k">Em (buồn): (Tiếc quá...)</code></p>
        <p><b>Chỗ tự điền:</b> <code class="k">{ten}</code> tên em · <code class="k">{diem}</code> điểm · <code class="k">{muctieu}</code> mục tiêu · <code class="k">{thieu}</code> số điểm còn thiếu · <code class="k">{qua}</code> phần thưởng · <code class="k">{diemNa}</code> <code class="k">{diemBin}</code> điểm của bạn · <code class="k">{kithi}</code> tên kì thi</p>
      </div>
    </div>
  </div>`;
  $('#en-id').onchange = (e) => { st.id = e.target.value; admEndings(); };
  $$('[data-band]').forEach(b => b.onclick = () => { st.band = b.dataset.band; admEndings(); });
  const persist = async (obj, msg, keepText) => {
    try {
      const all = JSON.parse(JSON.stringify(CFG.endText || {}));
      if (!keepText) { all[st.id] = all[st.id] || {}; if (obj) all[st.id][key] = obj; else delete all[st.id][key]; }
      let g = parseFloat(String($('#en-gan').value).replace(',', '.')), k = parseFloat(String($('#en-kha').value).replace(',', '.'));
      if (!(g >= 0)) g = CFG.nguongGan; if (!(k >= 0)) k = CFG.nguongKha; if (k < g) k = g;
      const cfgNow = await Sys.getCfg().catch(() => null) || {};
      await Sys.setCfg(Object.assign({}, cfgNow, { endText: all, nguongGan: g, nguongKha: k }));
      CFG.endText = all; CFG.nguongGan = g; CFG.nguongKha = k; toast(msg); admEndings();
    } catch (e) { $('#en-msg').textContent = 'Chưa lưu được: ' + e.message; }
  };
  $('#en-save').onclick = () => {
    const lines = $('#en-lines').value.trim();
    if (!lines) { $('#en-msg').textContent = 'Lời thoại đang trống.'; return; }

  };

  $('#en-reset').onclick = () => confirmBox('Bỏ phần đã sửa và dùng lại lời thoại gốc cho kết thúc này?', 'Dùng lời thoại gốc', () => persist(null, 'Đã khôi phục lời thoại gốc.'));
  $('#en-try').onclick = () => {
    const expect = 10, score = isGood ? 10 : key === 'gan' ? 9 : key === 'kha' ? 8 : 5;
    const fake = { player: { name: 'Minh', avatar: 'nam1', gender: 'nam', khoi: 5 }, expect, attempt: 1, hints: 0, foundClock: true };
    const keepS = S; S = fake;
    const steps = scriptToSteps($('#en-lines').value, endCtx({ score, na: 9.5, bin: 9 }, fake), key === 'xa' ? 'buon' : isGood ? 'vui' : 'binh');
    steps.unshift(sc.n(`(Xem thử: mục tiêu ${expect} điểm, em được ${score} điểm. Bấm “Về” ở góc phải để quay lại.)`));
    admEndings.draft = { title: $('#en-title').value, lines: $('#en-lines').value, lesson: $('#en-lesson').value };
    Scene.play(steps, () => { S = keepS; scrAdmin(); restoreDraft(); });
    const back = document.createElement('button'); back.className = 'btn small'; back.textContent = 'Về'; back.style.marginLeft = '8px';
    back.onclick = (e) => { e.stopPropagation(); S = keepS; scrAdmin(); restoreDraft(); };
    const tools = $('.comic-tools'); if (tools) tools.appendChild(back);
  };
  function restoreDraft() {
    const d = admEndings.draft; if (!d) return; admEndings.draft = null;
    const t = $('#en-title'), l = $('#en-lines'), le = $('#en-lesson');
    if (t) t.value = d.title; if (l) l.value = d.lines; if (le) le.value = d.lesson;
  }
}
function admCfg() {

    <div class="field"><span class="field-label">Cấu trúc đề cho khối</span><div class="seg" role="group" aria-label="Chọn khối để sửa cấu trúc đề">${[3, 4, 5].map(k => `<button type="button" class="btn small" data-ctk="${k}" aria-pressed="${k === admCfg.k}">Lớp ${k}</button>`).join('')}</div><span class="sub">Mỗi khối có cấu trúc đề riêng (lớp 4 mặc định 8 trắc nghiệm · 8 trả lời nhanh · 4 tự luận; lớp 5 mặc định 6 · 4 · 2).</span></div>
    <div class="cfg-grid">
      <div class="field"><label for="cf-kithi">Kì thi mặc định (lượt chơi cũ)</label><select id="cf-kithi" class="text-input">${['giữa học kì I', 'cuối học kì I', 'giữa học kì II', 'cuối học kì II', 'cuối năm'].map(t => `<option ${t === c.tenKiThi ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      ${num('cf-tg', 'Thời gian làm bài thi (phút)', c.thoiGianThi, 2, 120)}
      ${num('cf-sotn', `Số câu trắc nghiệm (lớp ${admCfg.k})`, ct.soTN, 0, 30)}
      ${num('cf-diemtn', 'Tổng điểm phần trắc nghiệm', ct.diemTN, 0, 10)}
      ${num('cf-sodien', 'Số câu điền đáp án ngắn', ct.soDien, 0, 30)}
      ${num('cf-diemdien', 'Tổng điểm phần điền ngắn', ct.diemDien, 0, 10)}
      ${num('cf-sobai', 'Số bài giải (bài dài)', ct.soBai, 0, 10)}
      ${num('cf-diembai', 'Tổng điểm phần bài giải', ct.diemBai, 0, 10, 'Ba phần cộng lại nên bằng 10. Nếu khác 10, game tự quy về thang 10.')}
    </div>

      ${num('cf-gio', 'Giây thật cho 1 giờ ảo', c.giayMoiGioAo, 3, 120, 'Ở tốc độ “Bình thường”. Học sinh chỉnh nhanh x2 hoặc chậm x2–x4 trong game.')}
      <div class="field"><label for="cf-truong">Tên trường in trên giấy thi</label><input id="cf-truong" class="text-input" maxlength="80" value="${esc(c.tenTruong)}"></div>
    </div>
    <div class="field"><span class="field-label">Số ngày ôn ở lượt đầu và 5 lần quay ngược</span>
      <div class="days-row">${c.ngayOn.map((d, i) => `<label><small>${i ? 'Quay ' + i : 'Lượt đầu'}</small><input class="text-input" type="number" min="1" max="30" value="${d}" data-day="${i}"></label>`).join('')}</div></div>
    <div class="form-msg" id="cf-msg"></div>

  </form></div>`;
  const save = async (obj) => { try { obj = Object.assign({ endText: CFG.endText || {}, nguongGan: CFG.nguongGan, nguongKha: CFG.nguongKha, events: CFG.events || {}, eventRate: CFG.eventRate == null ? 40 : CFG.eventRate, catOn: CFG.catOn !== false }, obj); await Sys.setCfg(obj); Object.assign(CFG, JSON.parse(JSON.stringify(CFG_DEFAULT))); applyCfg(obj); toast('Đã lưu cài đặt.'); admCfg(); } catch (e) { $('#cf-msg').textContent = e.message; } };
  $('#cf-form').onsubmit = (e) => {
    e.preventDefault();
    const days = $$('[data-day]').map(x => parseInt(x.value, 10));
    if (days.some(d => !(d >= 1 && d <= 30))) { $('#cf-msg').textContent = 'Số ngày ôn phải từ 1 đến 30.'; return; }
    keepDraft();
    for (const [k, v] of Object.entries(admCfg.draft)) if (v.soTN + v.soDien + v.soBai < 3) { $('#cf-msg').textContent = `Đề thi lớp ${k} cần có ít nhất 3 câu.`; return; }
    const cauTrucKhoi = Object.assign({}, CFG.cauTrucKhoi || {}); for (const [k, v] of Object.entries(admCfg.draft)) cauTrucKhoi[k] = v;

  $('#cf-reset').onclick = () => { admCfg.draft = {}; save(Object.assign(JSON.parse(JSON.stringify(CFG_DEFAULT)), { mo4: true, mo3: true })); };
  function keepDraft() { admCfg.draft[admCfg.k] = { soTN: +$('#cf-sotn').value, diemTN: +$('#cf-diemtn').value, soDien: +$('#cf-sodien').value, diemDien: +$('#cf-diemdien').value, soBai: +$('#cf-sobai').value, diemBai: +$('#cf-diembai').value }; }

async function admStudents() {

    <p class="sub">${ART_ON ? 'Hình minh hoạ nhân vật và bối cảnh sưu tầm từ Pinterest. ' : ''}Tài khoản giáo viên: ${esc(Auth.user.name)}.</p>
    <h3>Học sinh</h3><div id="hs-list"><p>Đang tải...</p></div></div>`;
  let list = [];

  if (curScreen !== 'admin') return;
  list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'vi'));
  $('#hs-list').innerHTML = list.length ? `<div style="overflow-x:auto"><table class="qtable"><thead><tr><th>Tên đăng nhập</th><th>Ngày tạo</th><th>Số lượt chơi</th><th>Buổi ôn luyện</th><th>Kết quả tốt nhất</th><th>Thử thách</th><th>Huy hiệu</th>${Sys.cloud ? '' : '<th></th>'}</tr></thead><tbody>
    ${list.map(p => { const pr = p.profile || {}; const b = pr.best; return `<tr><td><b>${esc(p.name)}</b></td><td>${p.created ? new Date(p.created).toLocaleDateString('vi-VN') : '–'}</td><td>${pr.runs || 0}</td><td>${pr.practiceTotal || 0}</td>
      <td>${b ? `${fmtScore(b.score)} điểm · lớp ${b.khoi} · quay ${b.rewinds} lần` : '–'}</td><td>${pr.challengePlays || 0} lượt</td><td>${Object.keys(pr.badges || {}).length}</td>${Sys.cloud ? '' : `<td><button class="btn small danger" data-rmhs="${p.key}">Xoá</button></td>`}</tr>`; }).join('')}</tbody></table></div>
    <p class="sub">${Sys.cloud ? 'Muốn đặt lại mật khẩu hoặc xoá tài khoản, vào Firebase Console → Authentication.' : 'Tài khoản đang lưu trên máy này.'}</p>` : '<p>Chưa có học sinh nào tạo tài khoản.</p>';
  $$('[data-rmhs]').forEach(b => b.onclick = () => {
    const p = list.find(x => x.key === b.dataset.rmhs);

      const acc = store.get(KEYS.accounts, {}); delete acc[p.key]; store.set(KEYS.accounts, acc);
      store.del(KEYS.profile + ':' + p.key); store.del(KEYS.save + ':' + p.key); toast('Đã xoá tài khoản.'); admStudents();

}

/* ===================== KHỞI ĐỘNG ===================== */
let SITE_CFG = null;
async function loadSystem() {
  try { const c = await Sys.getCfg(); if (c) applyCfg(c); else if (SITE_CFG && SITE_CFG.tenTruong) CFG.tenTruong = SITE_CFG.tenTruong; } catch (e) { console.warn(e); }
  let b = null;
  try { b = await Sys.getBank(); } catch (e) { console.warn(e); }
  if (b && Array.isArray(b.rows) && (b.rows.length || b.updatedAt)) { const m = mergeSample4(b.rows); Bank.set(m.rows, Sys.cloud ? 'Hệ thống (trực tuyến)' : 'Hệ thống (máy này)'); Bank.merged4 = m.added; }
  else Bank.set(sampleRows(), 'Bộ câu hỏi mẫu có sẵn');
}
async function boot() {
  view(`<div class="screen loading-screen"><div class="load-clock"><img class="load-watch" src="assets/ui/watch.webp" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span style="display:none">${clockSvg({ spin: true })}</span></div><p>Đang lên dây cót...</p></div>`, 'loading');
  try { const r = await fetch('cau-hinh.json', { cache: 'no-store' }); if (r.ok) SITE_CFG = await r.json(); } catch (e) { }
  ART_ON = await probeArt();
  if (ART_ON) preloadArt();
  await Sys.init(SITE_CFG && SITE_CFG.firebase);
  await loadSystem();
  await Auth.restore();
  if (Auth.user) await loadUserData();
  scrSplash();
}
