<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán học - Nếu có thể ngược thời gian</title>
<meta name="description" content="Game nhập vai ôn thi cho học sinh lớp 3, 4, 5">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Mali:ital,wght@0,500;0,600;1,600&family=Nunito:wght@500;600;700;800&family=Patrick+Hand&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: một "bàn học" tối màu đêm ôn thi; mọi bảng là trang vở ô li, lịch bóc, giấy kiểm tra. */
:root{
  --night:#1F2150;      /* nền đêm ôn thi */
  --night-2:#2B2E6B;
  --ink:#2A2350;        /* mực tím than */
  --ink-soft:#5B5585;
  --paper:#FCFDFF;      /* giấy vở */
  --grid:#D6E4F7;       /* dòng kẻ ô li */
  --margin:#F07C8C;     /* lề đỏ */
  --brass:#E2AE4A;      /* vỏ đồng hồ */
  --brass-dark:#9C6B1F;
  --sakura:#FF8FB1;     /* điểm nhấn hồng */
  --mint:#3DBE95;       /* đúng */
  --wrong:#E8594A;      /* sai, mực đỏ cô giáo */
  --sky:#8EC9F2;
  --chip:#EEF0FF;
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS","Nunito",cursive;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
/* Khung gốc: là "màn hình" của game. Bố cục co giãn theo khung này (container query),
   nên khi xoay ngang ảo (quay cả khung 90°) mọi thứ vẫn sắp xếp như điện thoại nằm ngang. */
#root{position:fixed;inset:0;container:app / size;overflow:hidden}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body.force-land #root{inset:auto;top:0;left:0;width:100cqh;height:100cqw;transform-origin:0 0;transform:translateX(100cqw) rotate(90deg)}
.rot-btn{display:none}
@media (hover:none) and (pointer:coarse){.rot-btn{display:grid}}
.sp-rot{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:12px;z-index:3;background:rgba(18,15,46,.5)}
body{
  background:var(--night);
  background-image:
    radial-gradient(circle at 15% 12%, rgba(255,255,255,.08) 0 1px, transparent 2px),
    radial-gradient(circle at 72% 30%, rgba(255,255,255,.07) 0 1px, transparent 2px),
    radial-gradient(circle at 40% 80%, rgba(255,255,255,.06) 0 1px, transparent 2px),
    radial-gradient(ellipse at 50% -10%, var(--night-2), var(--night) 70%);
  background-size:180px 180px,240px 240px,300px 300px,100% 100%;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.5;
}
#app{
  max-width:1100px;margin:0 auto;min-height:100%;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 28px;
  display:flex;flex-direction:column;gap:14px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sakura);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.screen{display:flex;flex-direction:column;gap:14px;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- Giấy vở ô li ---------- */
.paper{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, rgba(214,228,247,.55) 1px, transparent 1px);
  background-size:100% 100%, 22px 22px, 22px 22px;
  border-radius:14px;
  box-shadow:0 10px 0 rgba(0,0,0,.18), 0 18px 40px rgba(10,8,40,.35);
  padding:22px 22px 22px 58px;
  position:relative;min-width:0;
}
.paper.plain{background-image:linear-gradient(var(--grid) 1px, transparent 1px);background-size:22px 22px;padding:20px}

/* ---------- Nút ---------- */
.btn{
  border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;
  padding:10px 20px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;
  box-shadow:0 4px 0 var(--ink);transition:transform .08s, box-shadow .08s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sakura);}
.btn.brass{background:var(--brass);}
.btn.mint{background:#9FE6CC}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7);box-shadow:0 4px 0 rgba(255,255,255,.35)}
.btn.small{padding:6px 14px;font-size:.92rem;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.8);background:rgba(255,255,255,.08);display:grid;place-items:center;padding:0}
.icon-btn svg{width:22px;height:22px}

/* ---------- Thanh trên ---------- */
.topbar{display:flex;align-items:center;gap:10px;color:#fff;flex-wrap:wrap}
.topbar .grow{flex:1}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:30px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:.9rem}
.pill svg{width:18px;height:18px}

/* ---------- Màn tiêu đề ---------- */
.title-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:24px;align-items:center;min-height:70cqh}
.title-wrap > *{min-width:0}
.title-text{color:#fff}
.title-eyebrow{font-family:var(--f-hand);font-size:1.3rem;color:var(--brass);letter-spacing:.02em}
.title-big{font-size:clamp(2.6rem,7cqw,4.6rem);font-weight:800;color:#fff;margin:6px 0 10px;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.title-big span{color:var(--brass);display:block}
.title-sub{font-size:1.08rem;color:#D9DBFF;max-width:46ch}
.title-menu{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.title-clock{display:grid;place-items:center}
.title-clock svg{width:min(380px,90%);height:auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))}
.login-line{margin-top:16px;font-size:.92rem;color:#C9CBF5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rewind-pips{display:flex;gap:6px;align-items:center}
.rewind-pips i{width:16px;height:16px;border-radius:50%;background:var(--brass);border:2px solid #fff;display:block}
.rewind-pips i.used{background:transparent;border-color:rgba(255,255,255,.35)}

/* ---------- Tạo nhân vật ---------- */
.create{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}
.create > *{min-width:0}
.preview-card{background:linear-gradient(#BFE3F7,#E8F4FC 70%,#DCC6A8 70%);border-radius:18px;border:4px solid var(--ink);display:grid;place-items:end center;padding-top:20px;min-height:340px;position:relative;overflow:hidden}
.preview-card svg{width:82%;height:auto}
.preview-name{position:absolute;top:12px;left:12px;right:12px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field > label,.field-label{font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.text-input{border:3px solid var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:1.1rem;background:#fff;max-width:360px;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg button{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:10px 16px;font-family:var(--f-display);font-weight:700;font-size:1.02rem;min-width:96px}
.seg button[aria-pressed="true"]{background:var(--brass);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.seg button small{display:block;font-family:var(--f-body);font-weight:600;font-size:.78rem;color:var(--ink-soft)}
.swatches{display:flex;gap:10px}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);padding:0}
.swatches button[aria-pressed="true"]{outline:4px solid var(--sakura);outline-offset:2px}

/* ---------- Cảnh truyện (visual novel) ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:4px solid #0E0F2E;background:#000;user-select:none;max-height:78cqh}
@container app (max-width:700px){.stage{aspect-ratio:3/4}}
.stage .bg{position:absolute;inset:0}
.stage .bg svg{width:100%;height:100%;display:block}
.stage .tint{position:absolute;inset:0;pointer-events:none;transition:background .6s}
.slot{position:absolute;bottom:22%;width:27%;max-width:290px;transition:filter .25s, transform .3s;transform-origin:bottom center}
.slot svg{width:100%;height:auto;display:block}
.slot.left{left:8%}
.slot.right{right:8%}
.slot.dim{filter:brightness(.72) saturate(.85)}
.slot.speak{transform:scale(1.03)}
.slot.enter{animation:slotIn .4s ease}
@keyframes slotIn{from{opacity:.01;transform:translateY(20px)}to{opacity:1}}
@container app (max-width:700px){.slot{width:50%;bottom:27%}.slot.left{left:-2%}.slot.right{right:-2%}}
.dialog{
  position:absolute;left:3%;right:3%;bottom:3%;
  background:rgba(252,253,255,.97);border:4px solid var(--ink);border-radius:18px;
  padding:18px 22px 14px;min-height:28%;
  box-shadow:0 6px 0 rgba(0,0,0,.25);cursor:pointer;
}
.dialog .who{position:absolute;top:-20px;left:22px;background:var(--brass);border:3px solid var(--ink);border-radius:10px;padding:2px 14px;font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.dialog .who.tt{background:#BDE7FF}
.dialog .who:empty{display:none}
.dialog .text{font-size:clamp(1rem,2.2cqw,1.22rem);font-weight:600;line-height:1.55}
.dialog .text.narr{font-style:italic;color:var(--ink-soft)}
.dialog .next{position:absolute;right:16px;bottom:10px;font-size:.85rem;color:var(--ink-soft);animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.scene-tools{position:absolute;top:10px;right:10px;display:flex;gap:8px;z-index:5}
.scene-tools .btn{padding:4px 12px;font-size:.85rem;box-shadow:0 2px 0 var(--ink)}
.choices{position:absolute;inset:0;background:rgba(20,18,60,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:4}
.choices .btn{min-width:min(420px,90%);font-size:1.1rem}

/* Chọn mức kỳ vọng */
.expect-wrap{position:absolute;inset:0;background:rgba(20,18,60,.9);z-index:6;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.expect-wrap h2{color:#fff;font-size:1.5rem}
.expect-wrap p.lead{color:#E5E6FF;margin:0}
.expect-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@container app (max-width:820px){.expect-grid{grid-template-columns:repeat(2,1fr)}}
@container app (max-width:420px){.expect-grid{grid-template-columns:minmax(0,1fr)}}
.expect-card{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--ink)}
.expect-card[aria-pressed="true"]{background:#FFF0F5;box-shadow:0 5px 0 var(--sakura), 0 0 0 4px var(--sakura)}
.expect-num{font-family:var(--f-hand);font-size:2.6rem;color:var(--wrong);line-height:1;width:64px;height:64px;border:3px solid var(--wrong);border-radius:50%;display:grid;place-items:center;transform:rotate(-6deg)}
.expect-card h3{font-size:1.15rem}
.expect-card .gift{font-size:.92rem}
.expect-card .frame{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.frame-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.expect-card .tag{font-size:.78rem;color:var(--ink-soft)}

/* ---------- Bàn học: lịch & hoạt động ---------- */
.hub{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.hub > *{min-width:0}
.calendar{background:#fff;border:4px solid var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.25);text-align:center;position:relative}
.calendar .rings{height:18px;background:var(--ink);display:flex;justify-content:space-around;align-items:center}
.calendar .rings i{width:10px;height:10px;border-radius:50%;background:#fff;display:block}
.calendar .head{background:var(--wrong);color:#fff;font-family:var(--f-display);font-weight:800;padding:4px 0;letter-spacing:.06em;text-transform:uppercase;font-size:.9rem}
.calendar .big{font-family:var(--f-display);font-weight:800;font-size:5.4rem;line-height:1;color:var(--wrong);margin-top:8px;font-variant-numeric:tabular-nums}
.calendar .big.blue{color:var(--ink)}
.calendar .cap{font-family:var(--f-display);font-weight:800;font-size:1rem;margin-bottom:4px}
.calendar .sub{font-size:.88rem;color:var(--ink-soft);padding:0 10px 10px}
.calendar .torn{height:10px;background:radial-gradient(circle at 5px 0, transparent 5px, #fff 6px) repeat-x;background-size:10px 10px}
.vclock{display:flex;align-items:center;gap:12px;justify-content:center;padding:10px;border-top:2px dashed var(--grid)}
.vclock svg{width:62px;height:62px}
.vclock .digital{font-family:var(--f-display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums}
.vclock .digital small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--ink-soft);font-weight:700}
.dayline{height:10px;border-radius:999px;background:var(--chip);margin:0 14px 12px;overflow:hidden;border:2px solid var(--ink)}
.dayline b{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--brass),var(--wrong));transition:width .25s linear}
.paused-note{font-size:.8rem;color:var(--ink-soft);padding:0 10px 10px}

.hub-main{display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@container app (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;min-width:0}
.stat .k{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft)}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.bar{height:10px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:6px;border:2px solid var(--ink)}
.bar b{display:block;height:100%;background:var(--mint);transition:width .4s}
.bar.mood b{background:var(--sakura)}
.bar.low b{background:var(--wrong)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.act{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 14px;text-align:left;display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 12px;align-items:center;box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.act:hover:not([disabled]){transform:translateY(-2px)}
.act:active:not([disabled]){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.act[disabled]{opacity:.45;cursor:not-allowed}
.act .ic{grid-row:span 2;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;border:2px solid var(--ink)}
.act .ic svg{width:30px;height:30px}
.act b{font-family:var(--f-display);font-size:1.1rem;line-height:1.1}
.act span{font-size:.82rem;color:var(--ink-soft);line-height:1.3}
.act.study .ic{background:#CFE7FF}.act.review .ic{background:#FFE3B3}.act.rest .ic{background:#D7F5E8}.act.play .ic{background:#FFD3E1}.act.sleep .ic{background:#DCD6FF}
.tip{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.4);border-radius:16px;padding:10px 14px;color:#fff}
.tip svg{width:56px;height:56px;flex:none}
.tip p{margin:0;font-size:.98rem}
.weak{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.weak span{background:#FFE7E3;border:2px solid var(--wrong);color:#9D2A1F;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:700}

/* ---------- Bài làm (luyện tập / thi) ---------- */
.quiz-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#fff}
.quiz-head .grow{flex:1}
.timer{font-family:var(--f-display);font-weight:800;font-size:1.5rem;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:2px 14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.timer.warn{background:#FFE1DC;color:var(--wrong);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.exam-paper{padding-top:18px}
.exam-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.exam-header > *{min-width:0}
.exam-school{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.exam-title{font-family:var(--f-display);font-weight:800;font-size:1.35rem;margin:2px 0}
.exam-meta{font-size:.92rem}
.exam-meta .hand{font-family:var(--f-hand);font-size:1.25rem;color:#1B4EA6}
.score-boxes{display:flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:#fff}
.score-boxes > div{padding:4px 8px;min-width:84px;text-align:center}
.score-boxes > div + div{border-left:2px solid var(--ink);min-width:150px;max-width:220px}
.score-boxes .lbl{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--ink);margin-bottom:2px}
.red-pen{font-family:var(--f-hand);color:var(--wrong);font-size:2.3rem;line-height:1.1;min-height:44px}
.red-pen.comment{font-size:1.15rem;line-height:1.25;text-align:left}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.qnav button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.qnav button.done{background:#D7E9FF}
.qnav button.cur{background:var(--brass)}
.qnav button.ok{background:#BDF0DC}
.qnav button.bad{background:#FFCEC6}
.q-label{font-family:var(--f-display);font-weight:800;font-size:1.05rem;color:var(--ink-soft)}
.q-text{font-size:clamp(1.12rem,2.4cqw,1.35rem);font-weight:700;margin:4px 0 14px;max-width:65ch}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@container app (max-width:640px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-size:1.08rem;font-weight:700;min-height:56px}
.opt .bub{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.opt[aria-pressed="true"]{background:#EAF2FF}
.opt[aria-pressed="true"] .bub{background:var(--ink);color:#fff}
.opt.correct{background:#DDF7EC;border-color:var(--mint)}
.opt.correct .bub{background:var(--mint);color:#fff;border-color:var(--mint)}
.opt.wrong{background:#FFE6E1;border-color:var(--wrong)}
.opt.wrong .bub{background:var(--wrong);color:#fff;border-color:var(--wrong)}
.opt.gone{opacity:.25;text-decoration:line-through;pointer-events:none}
.fill-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fill-input{border:none;border-bottom:3px dotted var(--ink);background:transparent;font-family:var(--f-hand);font-size:1.7rem;color:#1B4EA6;padding:2px 6px;width:min(320px,100%)}
.fill-input:focus{outline:none;border-bottom-style:solid;border-color:var(--sakura)}
.feedback{margin-top:14px;border-radius:14px;padding:12px 14px;border:3px solid var(--ink);display:flex;gap:12px;align-items:flex-start}
.feedback.ok{background:#DDF7EC}
.feedback.bad{background:#FFEDEA}
.feedback b{font-family:var(--f-display);font-size:1.1rem}
.feedback p{margin:2px 0 0}
.quiz-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.quiz-foot .grow{flex:1}
.qtimer-line{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:12px}
.qtimer-line b{display:block;height:100%;background:var(--brass);transition:width .25s linear}

/* Kết quả */
.result-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.result-grid > *{min-width:0}
@container app (max-width:820px){.result-grid{grid-template-columns:minmax(0,1fr)}}
.verdict{display:flex;flex-direction:column;gap:10px}
.verdict .big{font-family:var(--f-display);font-size:2rem;font-weight:800}
.friend-row{display:flex;gap:12px;flex-wrap:wrap}
.friend{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:4px 12px 4px 4px}
.friend svg{width:44px;height:52px}
.friend b{font-family:var(--f-hand);color:var(--wrong);font-size:1.4rem}
.review-list{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow:auto;padding-right:4px}
.review-item{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;background:#fff}
.review-item.ok{border-color:var(--mint)}
.review-item.bad{border-color:var(--wrong)}
.review-item .q{font-weight:700}
.review-item .a{font-size:.92rem;margin-top:4px}
.review-item .a .you{font-family:var(--f-hand);font-size:1.1rem;color:#1B4EA6}
.review-item .ex{font-size:.88rem;color:var(--ink-soft);margin-top:2px}
.stamp{align-self:flex-start;display:inline-block;border:4px solid var(--wrong);color:var(--wrong);font-family:var(--f-display);font-weight:800;padding:2px 12px;border-radius:8px;transform:rotate(8deg);font-size:1.1rem;letter-spacing:.06em;opacity:.85;background:rgba(255,255,255,.6)}
.stamp.pass{border-color:var(--mint);color:#178A66}

/* Kết thúc */
.ending-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ending-card > *{min-width:0}
.ending-medal svg{width:120px;height:120px}
.ending-kicker{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
.ending-title{font-size:2rem;font-weight:800}
.lesson{background:#FFF7D6;border:2px dashed var(--brass-dark);border-radius:12px;padding:10px 14px;margin-top:10px}
.newbadges{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

/* Huy hiệu & kết thúc */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:3px solid #fff;background:transparent;color:#fff;border-radius:999px;padding:6px 16px;font-family:var(--f-display);font-weight:800}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.badge{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.badge svg{width:72px;height:72px}
.badge b{font-family:var(--f-display);font-size:1.02rem;line-height:1.15}
.badge span{font-size:.8rem;color:var(--ink-soft);line-height:1.3}
.badge.locked{opacity:.55}
.badge.locked svg{filter:grayscale(1)}
.end-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.end-item{border:3px solid var(--ink);border-radius:14px;padding:12px;background:#fff}
.end-item.good{border-color:var(--mint)}
.end-item.bad{border-color:var(--wrong)}
.end-item.locked{background:var(--chip);border-style:dashed;color:var(--ink-soft)}
.end-item b{font-family:var(--f-display);font-size:1.05rem}
.end-item p{margin:4px 0 0;font-size:.86rem}

/* Bảng xếp hạng */
.board-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.board-table-wrap{overflow-x:auto}
table.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:560px}
table.board th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);padding:6px 8px;border-bottom:3px solid var(--ink)}
table.board td{padding:8px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.board tr.me td{background:#FFF0F5}
.rank{width:44px;text-align:center;font-family:var(--f-display);font-weight:800}
.rank svg{width:34px;height:34px}
.pname{display:flex;align-items:center;gap:8px;font-weight:800}
.pname .frame-dot{width:16px;height:16px}
.board-empty{padding:26px;text-align:center;color:var(--ink-soft)}
.board-note{font-size:.85rem;color:var(--ink-soft);margin-top:8px}

/* Góc giáo viên */
.teacher-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.teacher-grid > *{min-width:0}
@container app (max-width:820px){.teacher-grid{grid-template-columns:minmax(0,1fr)}}
table.count{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.count th,table.count td{border:1px solid var(--grid);padding:6px 8px;text-align:left;font-size:.92rem}
table.count th{background:var(--chip)}
.warnlist{max-height:220px;overflow:auto;font-size:.86rem;background:#FFF6F4;border:2px solid var(--wrong);border-radius:10px;padding:8px 12px}
.warnlist:empty{display:none}
.okline{color:#178A66;font-weight:800}
.file-drop{border:3px dashed var(--ink);border-radius:14px;padding:18px;text-align:center;background:#fff}
.preview-q{border:2px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;margin-top:10px}
code.k{background:var(--chip);border-radius:6px;padding:0 6px;font-size:.88em}

/* Hộp thoại */
.modal-back{position:fixed;inset:0;background:rgba(14,12,46,.65);display:grid;place-items:center;z-index:50;padding:16px}
.modal{max-width:560px;width:100%;max-height:88cqh;overflow:auto}
.modal h2{font-size:1.5rem;margin-bottom:8px}
.modal .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--grid)}
.switch{width:58px;height:32px;border-radius:999px;border:3px solid var(--ink);background:#ddd;position:relative;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.switch[aria-checked="true"]{background:var(--mint)}
.switch[aria-checked="true"]::after{left:26px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}

/* Quay ngược */
.warp{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(circle,#3B2F7A,#120F33 70%);overflow:hidden}
.warp svg.big{width:min(70vmin,460px);height:auto;animation:warpSpin 3.2s cubic-bezier(.5,0,.3,1) forwards}
.warp .rings{position:absolute;inset:-20%;background:repeating-radial-gradient(circle, rgba(226,174,74,.18) 0 2px, transparent 3px 46px);animation:warpRings 3.2s linear forwards}
.warp .msg{position:absolute;bottom:12%;left:16px;right:16px;text-align:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,4cqw,2rem)}
.warp .msg small{display:block;font-family:var(--f-body);font-weight:700;color:var(--brass);font-size:1rem}
@keyframes warpSpin{0%{transform:rotate(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:rotate(-1080deg) scale(1.05)}}
@keyframes warpRings{from{transform:scale(1.6) rotate(0)}to{transform:scale(.4) rotate(-180deg)}}
.hand-spin{transform-origin:100px 100px;animation:spinBack 1.2s linear infinite}
@keyframes spinBack{to{transform:rotate(-360deg)}}

.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 32px)}
.toast{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 18px;font-weight:800;box-shadow:0 5px 0 var(--ink);animation:fadeIn .25s;text-align:center}
.foot-note{color:#B9BBEA;font-size:.82rem;text-align:center}

@container app (max-width:820px){
  .title-wrap{grid-template-columns:minmax(0,1fr);min-height:0}
  .title-clock{order:-1}
  .title-clock svg{width:min(240px,70%)}
  .create{grid-template-columns:minmax(0,1fr)}
  .preview-card{min-height:260px}
  .preview-card svg{width:46%}
  .hub{grid-template-columns:minmax(0,1fr)}
  .calendar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);text-align:center}
  .calendar .rings,.calendar .head,.calendar .torn{grid-column:1/-1}
  .vclock{border-top:none;border-left:2px dashed var(--grid);flex-direction:column}
  .dayline,.paused-note{grid-column:1/-1}
  .ending-card{grid-template-columns:minmax(0,1fr)}
  .exam-header{grid-template-columns:minmax(0,1fr)}
}
@container app (max-width:480px){
  .paper{padding:16px 14px 16px 40px;background-size:100% 100%,22px 22px,22px 22px;background-image:linear-gradient(90deg, transparent 26px, var(--margin) 26px, var(--margin) 28px, transparent 28px),linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, rgba(214,228,247,.55) 1px, transparent 1px)}
  .calendar .big{font-size:4rem}
}

/* ======================= v2: MENU KIỂU GAME ======================= */
:root{ --f-comic:"Mali","Nunito",system-ui,sans-serif; --glass:rgba(22,18,64,.55); }
.brand{background:none;border:0;padding:0;color:#fff}
.brand svg{width:34px;height:34px}
.screen-title{color:#fff;font-size:1.9rem}
.screen-sub{color:#D9DBFF;margin:-6px 0 0}
.sub{font-size:.86rem;color:var(--ink-soft)}
.menu-screen{position:relative;border-radius:22px;overflow:hidden;min-height:min(88cqh,780px);border:4px solid #0E0F2E;box-shadow:0 20px 60px rgba(0,0,0,.45);display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,330px);grid-template-rows:auto 1fr auto;gap:12px;padding:18px 22px;isolation:isolate}
.menu-art{position:absolute;inset:0;z-index:-2}
.menu-art > svg{width:100%;height:100%;display:block}
.menu-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(14,12,46,.55) 0%,rgba(14,12,46,0) 34%,rgba(14,12,46,0) 60%,rgba(14,12,46,.55) 100%),linear-gradient(180deg,rgba(14,12,46,.35),rgba(14,12,46,0) 20%,rgba(14,12,46,0) 80%,rgba(14,12,46,.6))}
.ka-ring{transform-origin:1080px 400px;animation:kaRing 120s linear infinite}
.ka-hands{animation:kaHands 18s linear infinite reverse}
.ka-float{animation:kaFloat 4s ease-in-out infinite}
@keyframes kaRing{to{transform:rotate(360deg)}}
@keyframes kaHands{to{transform:rotate(360deg)}}
@keyframes kaFloat{50%{transform:translateY(-14px)}}
.menu-top{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.menu-top .grow{flex:1}
.profile-card{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 16px 4px 4px;color:#fff;text-align:left}
.profile-card .avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(#BDE3FF,#FFE1EC);border:3px solid var(--brass);overflow:hidden;display:block;flex:none}
.profile-card .avatar svg{width:100%;height:100%}
.profile-card b{display:block;font-family:var(--f-display);font-size:1.1rem;line-height:1.1}
.profile-card small{font-size:.8rem;color:#E3E4FF}
.menu-logo{grid-column:1;align-self:start;color:#fff;max-width:520px;margin-top:2cqh}
.menu-logo .eyebrow{font-family:var(--f-hand);font-size:1.35rem;color:var(--brass)}
.menu-logo h1{font-size:clamp(2.6rem,6.5cqw,4.6rem);font-weight:800;line-height:.95;text-shadow:0 4px 0 #1B1650,0 0 26px rgba(255,200,120,.35);-webkit-text-stroke:2px #1B1650;paint-order:stroke fill}
.menu-logo h1 span{display:block;color:#FFD36E}
.menu-side{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:10px;align-self:center}
.mbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid rgba(255,255,255,.45);background:var(--glass);backdrop-filter:blur(8px);color:#fff;border-radius:16px;padding:10px 14px;font-family:var(--f-display);font-weight:800;font-size:1.08rem;transition:transform .12s, background .12s}
.mbtn svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.mbtn:hover{transform:translateX(-4px);background:rgba(40,34,110,.75)}
.mbtn.hero{background:linear-gradient(135deg,#FF8FB1,#FFB86B);color:var(--ink);border:3px solid #fff;padding:14px 16px;box-shadow:0 6px 0 #B3456A,0 0 30px rgba(255,180,120,.55);animation:heroGlow 2.4s ease-in-out infinite}
.mbtn.hero b{display:block;font-size:1.5rem;line-height:1}
.mbtn.hero small{display:block;font-family:var(--f-body);font-weight:700;font-size:.82rem}
.mbtn.hero svg{width:42px;height:42px}
.mbtn.admin{border-color:var(--brass)}
@keyframes heroGlow{50%{box-shadow:0 6px 0 #B3456A,0 0 46px rgba(255,200,140,.85)}}
.menu-foot{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;color:#D9DBFF;font-size:.85rem;flex-wrap:wrap}
.linkish{background:none;border:0;color:#FFD36E;font-weight:800;text-decoration:underline;padding:0}
@container app (max-width:760px){
  .menu-screen{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto;min-height:calc(100cqh - 32px);padding:14px}
  .menu-shade{background:linear-gradient(180deg,rgba(14,12,46,.55),rgba(14,12,46,0) 30%,rgba(14,12,46,.1) 50%,rgba(14,12,46,.85) 75%)}
  .menu-logo{text-align:center;margin:0 auto}
  .menu-side{grid-column:1;grid-row:4}
  .profile-card small{display:none}
}

/* Đăng nhập */
.menu-screen.login{display:grid;place-items:center;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr}
.menu-screen.login .menu-shade{background:rgba(14,12,46,.45);backdrop-filter:blur(3px)}
.login-card{width:min(440px,100%);padding:24px;border-radius:20px;border:4px solid var(--ink)}
.login-logo{font-family:var(--f-display);font-weight:800;font-size:1.9rem;text-align:center;line-height:1.05;margin-bottom:12px;color:var(--ink)}
.login-logo span{color:#D9862A}
.tabs.light button{border-color:var(--ink);color:var(--ink)}
.tabs.light button[aria-selected="true"]{background:var(--ink);color:#fff}
.login-card .tabs{justify-content:center;margin-bottom:14px}
.pw-wrap{position:relative;max-width:360px}
.pw-wrap .text-input{padding-right:52px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:var(--ink-soft);display:grid;place-items:center;border-radius:10px}
.pw-eye svg{width:24px;height:24px}
.pw-eye[aria-pressed="true"]{color:var(--ink);background:var(--chip)}
.check{display:flex;align-items:center;gap:8px;font-weight:700;margin:2px 0 10px}
.check input{width:20px;height:20px;accent-color:var(--sakura)}
.form-msg{color:#B3261E;font-weight:700;min-height:1.2em;margin:4px 0 8px}
.form-msg:empty{display:none}
.form-msg.ok{color:#178A66}
.btn.wide{width:100%}
.btn.danger{background:#FFE1DC;color:#9D2A1F;border-color:#9D2A1F;box-shadow:0 3px 0 #9D2A1F}
.login-note{font-size:.9rem;margin:12px 0 4px}
.login-mode{font-size:.8rem;color:var(--ink-soft);margin:0}
.loading-screen{color:#fff;text-align:center;padding-top:26cqh}
.load-clock{width:140px;margin:0 auto}

/* ======================= v2: TRUYỆN TRANH ======================= */
.comic{position:relative;width:100%;aspect-ratio:16/10;max-height:82cqh;background:#FFFDF8;background-image:radial-gradient(rgba(42,35,80,.08) 1px,transparent 1.4px);background-size:7px 7px;border:4px solid #0E0F2E;border-radius:12px;padding:10px;box-shadow:0 14px 40px rgba(0,0,0,.4);cursor:pointer;outline:none}
.page{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:1fr 1fr;grid-template-areas:"a a" "b c";gap:10px}
.page.flip{animation:pageFlip .45s ease}
@keyframes pageFlip{from{opacity:.001;transform:perspective(900px) rotateY(-14deg) translateX(30px)}to{opacity:1;transform:none}}
.panel{position:relative;overflow:hidden;border:3.5px solid var(--ink);border-radius:6px;background:#fff;animation:panelIn .35s cubic-bezier(.3,1.4,.6,1)}
.panel.p0{grid-area:a}.panel.p1{grid-area:b}.panel.p2{grid-area:c}
@keyframes panelIn{from{opacity:.001;transform:scale(.94)}to{opacity:1;transform:none}}
.pbg{position:absolute;inset:0}
.pbg > svg{width:100%;height:100%;display:block}
.pbg.zoom-left{transform:scale(1.7);transform-origin:20% 60%;filter:blur(1.2px) saturate(.9)}
.pbg.zoom-right{transform:scale(1.7);transform-origin:80% 60%;filter:blur(1.2px) saturate(.9)}
.pchar{position:absolute;pointer-events:none}
.pchar svg{height:100%;width:auto;display:block}
.pchar.full{bottom:-4%;height:98%}
.pchar.full.left{left:7%}.pchar.full.right{right:7%}
.pchar.full.clock{height:62%;bottom:24%}
.pchar.full.dim{filter:brightness(.8) saturate(.85)}
.pchar.close{bottom:-30%;height:150%}
.pchar.close.left{left:-2%}.pchar.close.right{right:-2%}
.pchar.close.clock{height:96%;bottom:2%}
.fx{position:absolute;inset:0;pointer-events:none}
.fx-speed{background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(42,35,80,.22) 0deg 1.4deg,transparent 1.4deg 7deg);-webkit-mask:radial-gradient(circle at 50% 55%,transparent 32%,#000 62%);mask:radial-gradient(circle at 50% 55%,transparent 32%,#000 62%)}
.fx-gloom{background:linear-gradient(180deg,rgba(40,30,90,.45),rgba(40,30,90,.08) 70%),repeating-linear-gradient(90deg,rgba(40,30,90,.18) 0 2px,transparent 2px 12px)}
.fx-spark{background:radial-gradient(circle at 18% 22%,#FFF2A8 0 3px,transparent 4px),radial-gradient(circle at 82% 30%,#FFF2A8 0 4px,transparent 5px),radial-gradient(circle at 70% 12%,#fff 0 2px,transparent 3px),radial-gradient(circle at 30% 70%,#FFD6E4 0 3px,transparent 4px),radial-gradient(ellipse at 50% 60%,rgba(255,240,200,.45),transparent 60%)}
.fx-fire{background:radial-gradient(ellipse at 50% 110%,rgba(255,120,80,.35),transparent 60%)}
.sfx{position:absolute;top:6%;left:50%;transform:translateX(-50%) rotate(-8deg);font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,3.2cqw,2.3rem);color:#E8594A;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);white-space:nowrap;animation:sfxPop .4s cubic-bezier(.3,1.8,.6,1)}
@keyframes sfxPop{from{transform:translateX(-50%) rotate(-8deg) scale(.3)}}
.bubble{position:absolute;top:7%;max-width:60%;background:#fff;border:3px solid var(--ink);border-radius:26px;padding:8px 16px 10px;font-family:var(--f-comic);font-weight:600;font-size:clamp(.92rem,1.55cqw,1.08rem);line-height:1.45;color:var(--ink);box-shadow:3px 4px 0 rgba(42,35,80,.25);z-index:2}
.bubble .bn{display:block;font-family:var(--f-display);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#C2465A;line-height:1.2}
.bubble.b-full.at-left{left:20%}.bubble.b-full.at-right{right:20%}
.bubble.b-close.at-left{left:4%}.bubble.b-close.at-right{right:4%}
.bubble.b-close{max-width:56%;top:9%}
.bubble::before,.bubble::after{content:"";position:absolute;bottom:-21px;width:28px;height:22px;background:var(--ink)}
.bubble::after{bottom:-16px;width:21px;height:17px;background:#fff}
.bubble.tail-left::before{left:20px;clip-path:polygon(0 0,100% 0,0 100%)}
.bubble.tail-left::after{left:23.5px;clip-path:polygon(0 0,100% 0,0 100%)}
.bubble.tail-right::before{right:20px;clip-path:polygon(0 0,100% 0,100% 100%)}
.bubble.tail-right::after{right:23.5px;clip-path:polygon(0 0,100% 0,100% 100%)}
.bubble.b-close.tail-left::before,.bubble.b-close.tail-left::after{left:-24px;bottom:auto;top:46%;clip-path:polygon(100% 0,100% 100%,0 70%);width:26px;height:24px}

.bubble.think.tail-right::before{right:24px;bottom:-24px}.bubble.think.tail-right::after{right:14px;bottom:-38px}

/* ======================= v5: BẦU TRỜI THEO GIỜ ẢO ======================= */
#sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .6s;
  --sky-top:#3F9EEC;--sky-bot:#BFE6FF;--sun-x:50%;--sun-y:20%;--sun-o:1;--sun-glow:1;--moon-x:10%;--moon-y:70%;--moon-o:0;--stars:0;--town:#5B6FA6;--lights:0;--cloud:1}
body.sky-on{background:#24255E}
body.sky-on #sky{opacity:1}
.sky-grad{position:absolute;inset:0;background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 82%);transition:background 1s linear}
.sky-stars{position:absolute;inset:0;opacity:var(--stars);transition:opacity 1.2s}
.sky-stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
.sky-sun,.sky-moon{position:absolute;width:clamp(70px,9cqw,130px);aspect-ratio:1;transform:translate(-50%,-50%);transition:left .3s linear,top .3s linear,opacity 1s}
.sky-sun{left:var(--sun-x);top:var(--sun-y);opacity:var(--sun-o)}
.sky-sun span{position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFF8D6,#FFD447 55%,#FFA63D);box-shadow:0 0 calc(40px * var(--sun-glow)) calc(14px * var(--sun-glow)) rgba(255,214,90,.75),0 0 110px 40px rgba(255,200,90,calc(.35 * var(--sun-glow)))}
.sky-sun::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,226,120,.55) 0 8deg,transparent 8deg 22deg);-webkit-mask:radial-gradient(circle,transparent 42%,#000 44%,#000 60%,transparent 72%);mask:radial-gradient(circle,transparent 42%,#000 44%,#000 60%,transparent 72%);animation:sunspin 30s linear infinite}
@keyframes sunspin{to{transform:rotate(360deg)}}
.sky-moon{left:var(--moon-x);top:var(--moon-y);opacity:var(--moon-o)}
.sky-moon span{position:absolute;inset:22%;border-radius:50%;background:radial-gradient(circle at 38% 36%,#FFFCE8,#F3E7B0 70%);box-shadow:0 0 40px 10px rgba(255,248,200,.45),inset -10px -6px 0 rgba(200,180,120,.25)}
.sky-moon span::after{content:"";position:absolute;width:22%;height:22%;left:56%;top:30%;border-radius:50%;background:rgba(210,190,130,.35);box-shadow:-22px 18px 0 -2px rgba(210,190,130,.3)}
.sky-cloud{position:absolute;height:clamp(34px,4.5cqw,60px);aspect-ratio:3.2;opacity:var(--cloud);transition:opacity 1.2s;
  background:radial-gradient(circle at 30% 65%,#fff 0 30%,transparent 31%),radial-gradient(circle at 55% 45%,#fff 0 36%,transparent 37%),radial-gradient(circle at 78% 65%,#fff 0 28%,transparent 29%),linear-gradient(#fff,#fff) bottom/80% 40% no-repeat;filter:drop-shadow(0 4px 6px rgba(40,50,120,.12));animation:drift linear infinite}
.is-night .sky-cloud{filter:brightness(.55) drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.sky-cloud.c1{top:14%;animation-duration:90s;animation-delay:-20s}
.sky-cloud.c2{top:28%;transform:scale(.7);animation-duration:120s;animation-delay:-70s}
.sky-cloud.c3{top:8%;transform:scale(.55);animation-duration:150s;animation-delay:-110s}
@keyframes drift{from{left:-20%}to{left:110%}}
.sky-town{position:absolute;left:0;right:0;bottom:0;width:100%;height:18cqh;fill:var(--town);transition:fill 1.2s}
.sky-tint{position:absolute;inset:auto 0 0 0;height:18cqh;background:radial-gradient(circle at 20% 86%,rgba(255,220,120,var(--lights)) 0 3px,transparent 4px),radial-gradient(circle at 48% 80%,rgba(255,220,120,var(--lights)) 0 3px,transparent 4px),radial-gradient(circle at 72% 90%,rgba(255,220,120,var(--lights)) 0 3px,transparent 4px),radial-gradient(circle at 88% 84%,rgba(255,220,120,var(--lights)) 0 3px,transparent 4px);background-size:220px 100%}
@media (prefers-reduced-motion:reduce){.sky-cloud,.sky-sun::before,.sky-stars i{animation:none}}
/* khi có bầu trời: các chữ trắng đặt trên kính tối cho dễ đọc */
body.sky-on .topbar{background:rgba(22,18,64,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px;padding:8px 12px}
body.sky-on .tip{background:rgba(22,18,64,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-style:solid;border-color:rgba(255,255,255,.35)}
body.sky-on .calendar,body.sky-on .stat,body.sky-on .act{box-shadow:0 8px 24px rgba(20,20,70,.25),0 5px 0 var(--ink)}
.dayline{position:relative}
.dayline .school{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(-45deg,rgba(42,35,80,.25) 0 4px,transparent 4px 8px)}
.dayline-lbl{display:flex;justify-content:space-between;font-size:.66rem;font-weight:800;color:var(--ink-soft);margin:-8px 14px 10px}

/* ======================= v5: Ô PHÂN SỐ, NÚT DẤU, GỢI Ý ======================= */
.blank-row{cursor:default}
.fbox-wrap{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}
.fbox{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.fbox i{display:block;width:100%;min-width:64px;height:3px;border-radius:2px;background:var(--ink)}
.blank-row .fill-input.fbox-in{width:72px;min-width:0;height:46px;min-height:0;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.35rem;border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:0 4px;color:#1B4EA6}
.blank-row .fill-input.fbox-in:focus{border-color:var(--sakura);box-shadow:0 0 0 3px rgba(255,143,177,.35)}
.blank-row .fill-input.fbox-in.ok{border-color:var(--mint);color:#178A66;text-decoration:none}
.blank-row .fill-input.fbox-in.bad{border-color:var(--wrong);color:var(--wrong)}
.fbox-whole{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.fbox-whole .fbox-in{height:60px!important;font-size:1.6rem!important}
.fbox-wrap small{font-size:.66rem;font-weight:800;color:var(--ink-soft);letter-spacing:.03em}
.sym-group{display:inline-flex;gap:8px}
.sym-btn{width:54px;height:50px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;box-shadow:0 3px 0 var(--ink);padding:0}
.sym-btn[aria-pressed="true"]{background:var(--brass)}
.sym-btn.ok{background:#BDF0DC;border-color:#178A66}
.sym-btn.bad{background:#FFCEC6;border-color:var(--wrong)}
.sym-btn:disabled{cursor:default}
.blank-row .note{font-size:.85rem;font-weight:700;color:#178A66;background:#EFFBF5;border-radius:8px;padding:2px 8px}
.blank-hint{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;font-weight:600;color:var(--ink-soft);background:#FFFBEA;border:1.5px dashed #E2C46A;border-radius:10px;padding:6px 10px;margin-top:2px}
.blank-hint svg{flex:none;margin-top:1px}
.blank-hint b{color:var(--ink)}
@container app (max-width:480px){
  .blank-row .fill-input.fbox-in{width:64px;height:44px}
  .sym-btn{width:58px;height:52px}
  .blank-row{gap:6px 8px}
}
@container app (max-width:480px){.sym-btn{width:48px;height:48px;font-size:1.4rem}.sym-group{gap:6px}}

/* ======================= v6: KẾT THÚC THEO MỨC ĐIỂM ======================= */
.cheer{background:#FFF6E0;border:2px dashed var(--brass-dark);border-radius:12px;padding:8px 12px;font-weight:700}
.end-grid2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
@container app (max-width:900px){.end-grid2{grid-template-columns:minmax(0,1fr)}}
.en-text{max-width:100%!important;width:100%;font-family:var(--f-body);font-size:.98rem;line-height:1.55;resize:vertical}
.band-tabs{margin-bottom:12px}
.band-tabs button{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:6px 14px}
.band-tabs button small{font-family:var(--f-body);font-size:.72rem;font-weight:700;opacity:.8}
.en-help{font-size:.9rem;background:#F5F6FF;border-radius:12px;padding:8px 12px}
.en-help p{margin:6px 0}
.end-grid2 .cfg-grid .text-input{max-width:150px}

/* ===== v7: sự kiện ngẫu nhiên ===== */
.rewind-pips i.lost{background:#e2554f;border-color:#fff;position:relative;opacity:.85}
.rewind-pips i.lost::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.ev-top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:10px 0 14px}
.ev-group{margin-bottom:16px}
.ev-group h4{margin:0 0 8px;font-size:1.05rem;color:var(--ink)}
.ev-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid rgba(0,0,0,.12);border-radius:14px;margin-bottom:8px;background:#fff}
.ev-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ev-when{font-size:.78rem;font-weight:700;color:#7a5cff}
.quiz-pop{grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin-top:12px}
@container app (max-width:520px){.ev-row{flex-wrap:wrap}.ev-info{flex-basis:100%}.quiz-pop{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--mint);}

/* ===== v7: xoay ngang / màn hình dọc ===== */
#rotate-hint{display:none}
body.want-land #rotate-hint{display:flex;position:fixed;inset:0;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:linear-gradient(160deg,#2b2a5c,#5a3e8f);color:#fff;font-size:1.05rem}
body.want-land #rotate-hint b{font-size:1.4rem}
body.want-land #rotate-hint .btn{margin-top:8px}
.rh-phone{width:64px;height:110px;border:5px solid #fff;border-radius:14px;animation:rhRot 2.2s ease-in-out infinite}
@keyframes rhRot{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-90deg)}100%{transform:rotate(0)}}

/* ===== v7: tự cân đối điện thoại dọc ===== */
@container app (max-width:820px){ .calendar .dayline-lbl,.calendar .speed-box{grid-column:1/-1} }
@container app (max-width:480px){
  .topbar{flex-wrap:nowrap;gap:5px}

  .topbar .pill{min-width:0;flex:0 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

}

@container app (max-height:520px) and (orientation:landscape){

  .comic{height:calc(100cqh - 64px)}
}
/* điện thoại nhỏ xoay ngang (≤760 rộng): menu vẫn chia 2 cột như máy tính */
@container app (max-height:520px) and (orientation:landscape) and (max-width:760px){
  .menu-screen:not(.login){grid-template-columns:minmax(0,1fr) minmax(220px,300px);grid-template-rows:auto 1fr auto;min-height:calc(100cqh - 16px)}

  .menu-screen:not(.login) .menu-side{grid-column:2;grid-row:2;align-self:center;gap:6px}

}
@container app (max-width:380px){ .topbar .pill:first-of-type{display:none} }

/* ======================= v8: MÀN HÌNH MỞ ĐẦU ======================= */
.splash{position:fixed;inset:0;z-index:50;background:#120f2e;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;padding:0 16px max(20px,env(safe-area-inset-bottom,0px))}
.splash-art{position:absolute;inset:0;background:url(assets/bg/mo-dau.webp) 30% center/cover no-repeat,radial-gradient(ellipse at 30% 40%,#e0943a 0,#5b2a6e 25%,#1a1846 60%,#0b0a22 100%);animation:spZoom 18s ease-in-out infinite alternate}
.splash-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,15,46,0) 45%,rgba(18,15,46,.55) 72%,rgba(18,15,46,.95) 100%)}
@keyframes spZoom{from{transform:scale(1)}to{transform:scale(1.07)}}
.splash-card{position:relative;width:min(1150px,100%);background:rgba(32,26,62,.94);border-radius:18px;padding:22px 24px 24px;text-align:center;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.5);font-family:"Nunito",system-ui,sans-serif;animation:spUp .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes spUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.sp-eyebrow{color:#EBC97C;font-weight:800;letter-spacing:.03em;font-size:clamp(.9rem,2.4cqw,1.1rem)}
.sp-title{margin:10px 0 0;font-weight:800;font-size:clamp(1.7rem,5cqw,2.3rem);letter-spacing:.02em;color:#fff;font-family:inherit}
.sp-line{height:3px;background:#E3BE74;margin:18px 0 22px;border-radius:2px}
.sp-sub{color:#EBC97C;font-weight:800;font-size:clamp(1.1rem,3.4cqw,1.5rem);letter-spacing:.01em}
.sp-quote{color:#E8E5FF;font-style:italic;font-size:clamp(1rem,2.8cqw,1.3rem);margin-top:12px}
.sp-start{margin:22px auto 0;display:inline-flex;align-items:center;gap:10px;border:3px solid #fff;border-radius:999px;padding:12px 34px;background:linear-gradient(180deg,#FFD978,#E3A63A);color:#2a1b4a;font-weight:800;font-size:1.25rem;font-family:"Baloo 2","Nunito",sans-serif;box-shadow:0 0 0 0 rgba(255,211,110,.6),0 6px 0 #8a5a14;cursor:pointer;animation:spPulse 2s ease-in-out infinite}
.sp-start svg{width:26px;height:26px}
.sp-start:hover{filter:brightness(1.06)}
.sp-start:active{transform:translateY(3px);box-shadow:0 3px 0 #8a5a14}
@keyframes spPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,211,110,.55),0 6px 0 #8a5a14}50%{box-shadow:0 0 0 14px rgba(255,211,110,0),0 6px 0 #8a5a14}}
@container app (orientation:portrait){
  .splash-art{bottom:auto;height:62%;background-position:22% center,center}
  .splash-art::after{background:linear-gradient(180deg,rgba(18,15,46,0) 60%,#120f2e 100%)}
  .splash{justify-content:flex-end}
}
@container app (max-height:520px) and (orientation:landscape){
  .splash-card{padding:12px 18px 14px;width:min(720px,100%)}
  .sp-title{margin-top:4px;font-size:1.5rem}
  .sp-line{margin:10px 0 12px}
  .sp-quote{margin-top:6px}
  .sp-start{margin-top:12px;padding:8px 26px;font-size:1.1rem}
}
@media (prefers-reduced-motion:reduce){.splash-art,.sp-start,.splash-card{animation:none}}
.login-logo span{display:block;font-size:1.05rem;margin-top:4px}
.menu-logo h1 span{font-size:.55em;margin-top:8px;line-height:1.1}
@container app (orientation:landscape) and (min-height:521px){ .splash-card{width:min(820px,100%);padding:18px 24px 20px} .sp-line{margin:14px 0 16px} .splash-art{background-position:30% 35%,center} }

/* ======================= v9: MÈO MƯỚP ĐỘNG VIÊN ======================= */
.hub{position:relative}
.cat-seat{position:absolute;right:6px;bottom:-14px;width:84px;height:84px;padding:0;border:0;background:none;z-index:3;cursor:pointer;animation:catBob 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.cat-seat img,.cat-seat svg{width:100%;height:100%;object-fit:contain;display:block}
.cat-seat .zz{position:absolute;top:-6px;right:0;color:#fff;font-weight:800;font-size:.8rem;letter-spacing:2px}
.cat-seat:active{transform:scale(.92)}
@keyframes catBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cat-pop{position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:flex-end;gap:6px;max-width:min(440px,calc(100% - 24px));pointer-events:auto;cursor:pointer;transform:translateY(140%);opacity:0}
.cat-pop.in{animation:catIn .55s cubic-bezier(.2,1.4,.4,1) forwards}
.cat-pop.out{animation:catOut .35s ease-in forwards}
@keyframes catIn{from{transform:translateY(140%);opacity:0}to{transform:none;opacity:1}}
@keyframes catOut{from{transform:none;opacity:1}to{transform:translateY(140%);opacity:0}}
.cat-img{order:-1;width:92px;height:92px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.cat-img img,.cat-img svg{width:100%;height:100%;object-fit:contain;display:block}
.cat-bub{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:8px 14px 10px;font-family:var(--f-comic,var(--f-body));font-weight:600;font-size:1rem;line-height:1.4;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.18);margin-bottom:34px}
.cat-bub b{display:block;color:#E07B2A;font-size:.82rem;font-family:var(--f-display);letter-spacing:.03em}
@container app (max-width:480px){.cat-img{width:72px;height:72px}.cat-bub{font-size:.92rem}.cat-seat{width:70px;height:70px}}
@container app (max-height:520px) and (orientation:landscape){.cat-img{width:68px;height:68px}.cat-bub{margin-bottom:20px;font-size:.9rem}}
@media (prefers-reduced-motion:reduce){.cat-seat{animation:none}}
.ev-cat{background:#FFF6E5;border-color:#F2C27A;margin-bottom:16px}

/* ===== v9: chống chữ tự phóng to và tràn khung trên điện thoại ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea,button{max-width:100%;font:inherit}
.text-input,.field input,.field select,.pw-wrap{width:100%;min-width:0}
.field,.cfg-grid > *,.row > div{min-width:0}
.row{gap:10px}
.row > div{flex:1 1 auto}
.row > .switch,.row > button,.row > select{flex:none}
img,svg{max-width:100%}
@container app (max-width:480px){ .topbar .pill:first-of-type{display:none} }
.modal .row{flex-wrap:wrap}
.modal .row .seg{flex:none;margin-left:auto}
@container app (max-width:480px){ .modal .row .seg{width:100%;margin-left:0} .modal .row .seg .btn{flex:1} }

/* ===== v10: chịu được cỡ chữ hệ thống rất lớn (Android tăng cỡ chữ) ===== */
.screen,.paper,.menu-screen,.hub,.calendar,.stats,.acts,.create,.result-grid,.exam-header{min-width:0;max-width:100%}
.menu-screen > *,.hub > *,.act > *,.stat > *,.row > *,.field > *{min-width:0}
.menu-top{flex-wrap:wrap;row-gap:8px}
.profile-card{min-width:0;flex:0 1 auto;max-width:100%}
.profile-card b,.profile-card small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.profile-card > span:not(.avatar){min-width:0;overflow:hidden}
.mbtn{min-width:0}
.mbtn > span{min-width:0;overflow-wrap:anywhere}
.qnav button{width:auto;height:auto;min-width:2.3em;min-height:2.3em;padding:0 .35em;border-radius:999px;line-height:1}
.btn,.opt,.mbtn,.act{overflow-wrap:anywhere}
.topbar{flex-wrap:wrap}
@container app (max-width:480px){ .topbar{flex-wrap:wrap} }

/* ======================= v12: TRUYỆN TRANH GỌN CHO ĐIỆN THOẠI =======================
   2 khung mỗi trang; nhân vật thu nhỏ vừa khung (không bị cắt/méo); lời thoại nằm dải dưới hình. */
.comic.compact{aspect-ratio:auto!important;max-height:none!important;padding:8px}
.comic.cp-port{height:calc(100cqh - 84px);min-height:420px}
.comic.cp-land{height:calc(100cqh - 64px);min-height:250px}
.comic.compact .page{gap:8px;grid-template-areas:none!important}
.comic.cp-port .page{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:repeat(2,minmax(0,1fr))!important}
.comic.cp-land .page{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:minmax(0,1fr)!important}
.comic.compact .panel.p0,.comic.compact .panel.p1,.comic.compact .panel.p2{grid-area:auto}
/* nhân vật: đứng ở phần trên khung, giữ đúng tỉ lệ */
.comic.compact .pchar{bottom:30%!important;top:auto}
.comic.compact .pchar img.spr,.comic.compact .pchar svg{height:100%;width:auto;max-width:none}
.comic.compact .pchar.full:not(.clock):not(.pet){height:66%!important}
.comic.compact .pchar.close:not(.clock):not(.pet){height:72%!important}
.comic.compact .pchar.close.left{left:6%!important}.comic.compact .pchar.close.right{right:6%!important}
.comic.compact .pchar.full.left{left:4%}.comic.compact .pchar.full.right{right:4%}

/* ===================== v15: tạo nhân vật 2 bước, chữ rõ hơn, bản đồ trên điện thoại, đồng hồ mới ===================== */
/* Biểu tượng đồng hồ quả quýt */
.brand img.ui-watch{width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.m-watch img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.ka-c.clock.orbit{height:34%;left:52%;bottom:42%}
.ka-c.clock.orbit img{height:100%;width:auto;filter:drop-shadow(0 0 18px rgba(255,220,140,.55))}
/* Nền xoáy thời gian */
body.cosmic #scroller{background:linear-gradient(180deg,rgba(6,10,30,.35),rgba(8,10,34,.78)),url(assets/bg/spiral.webp) 50% 30%/cover fixed,#060a1e}
body.cosmic.vortex-bg #scroller{background:linear-gradient(180deg,rgba(6,10,40,.45),rgba(8,10,40,.8)),url(assets/bg/vortex.webp) center/cover fixed,#060a1e}
.warp-vortex{position:absolute;inset:-25%;background:url(assets/bg/vortex.webp) center/cover;animation:vortexSpin 3.2s cubic-bezier(.5,0,.3,1) forwards;opacity:.95}
.warp img.big{position:relative;width:min(70vmin,460px);height:auto;animation:warpSpin 3.2s cubic-bezier(.5,0,.3,1) forwards;filter:drop-shadow(0 0 30px rgba(255,220,150,.6))}
@keyframes vortexSpin{from{transform:rotate(0) scale(1)}to{transform:rotate(-200deg) scale(1.6)}}
/* Chuyển trạm */
.tw{position:fixed;inset:0;z-index:70;display:grid;place-items:center;overflow:hidden;animation:twIn .35s ease forwards}
.tw.out{animation:twOut .45s ease forwards}
.tw-bg{position:absolute;left:50%;top:50%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:url(assets/bg/vortex.webp) center/cover;animation:twSpin 1.2s cubic-bezier(.4,0,.2,1) forwards}
.tw-orbit{position:relative;width:min(56vmin,340px);height:auto;animation:twZoom 1.2s ease forwards;filter:drop-shadow(0 0 24px rgba(255,220,150,.7))}
.tw-msg{position:absolute;bottom:16%;left:16px;right:16px;text-align:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:clamp(1.2rem,4.5cqw,1.9rem);text-shadow:0 3px 0 #0B1240,0 0 18px rgba(120,180,255,.8)}
@keyframes twIn{from{opacity:0}to{opacity:1}}
@keyframes twOut{from{opacity:1}to{opacity:0;transform:scale(1.15)}}
@keyframes twSpin{from{transform:rotate(0) scale(1.4)}to{transform:rotate(-120deg) scale(1)}}
@keyframes twZoom{from{transform:scale(.4) rotate(-30deg);opacity:0}50%{opacity:1}to{transform:scale(1) rotate(10deg)}}
/* Màn hình chính: chữ nổi rõ */
.menu-logo .eyebrow{display:inline-block;font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.06em;color:#FFE7A8;background:rgba(20,16,60,.72);border:2px solid rgba(255,231,168,.6);padding:3px 14px;border-radius:999px;margin-bottom:8px;text-shadow:none}
.menu-logo h1 span{text-shadow:0 3px 0 #1B1650,0 0 14px rgba(0,0,0,.55)}
.mbtn.hero small{white-space:nowrap;font-size:clamp(.72rem,2.6cqw,.88rem);overflow:hidden;text-overflow:ellipsis}
.mbtn:not(.hero){background:rgba(22,18,66,.82);text-shadow:0 1px 2px rgba(0,0,0,.5)}
@container app (max-width:760px){.menu-shade{background:linear-gradient(180deg,rgba(14,12,46,.55),rgba(14,12,46,.25) 35%,rgba(14,12,46,.7) 70%,rgba(14,12,46,.9))!important}}
/* Thanh tab trên điện thoại: một hàng, vuốt ngang */
@container app (max-width:600px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;padding:6px 14px;font-size:.92rem}}
/* Tạo nhân vật 2 bước */
.create.cr{display:flex;flex-direction:column;gap:14px;max-width:980px;margin:0 auto;width:100%}
.cr-steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;counter-reset:none}
.cr-steps li{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 6px;border-radius:999px;background:rgba(255,255,255,.12);color:#C9C6F0;font-weight:800;font-size:.86rem;white-space:nowrap;border:2px solid rgba(255,255,255,.2)}
.cr-steps li span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:.8rem}
.cr-steps li.on{background:#FFE27A;color:var(--ink);border-color:#fff}
.cr-steps li.on span{background:var(--ink);color:#FFE27A}
.cr-steps li.done{background:rgba(61,190,149,.3);color:#fff;border-color:#3DBE95}
.cr-steps li.done span{background:#3DBE95}
.cr-box{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.25);color:var(--ink)}
.cr-title{font-size:clamp(1.2rem,3.6cqw,1.6rem);margin:0 0 12px;padding-bottom:8px;border-bottom:3px dashed #E7E3F6}
.cr-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.cr-grid button{padding:5px 4px 4px}
.cr-grid .av-pic{width:100%;max-width:76px}
.cr-grid button[aria-pressed="true"]{background:#FFE27A;transform:translateY(-2px)}
.cr-grid button[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:6px;width:22px;height:22px;border-radius:50%;background:#3DBE95;color:#fff;font-weight:900;font-size:.8rem;display:grid;place-items:center;border:2px solid #fff}
.cr-grid button{position:relative}
.cr-pick{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#FFF7DD,#FFE9F1)}
.cr-preview{width:150px;height:190px;flex:none;display:grid;place-items:end center;border-radius:16px;background:linear-gradient(#BFE3F7,#FFF1F6);border:3px solid var(--ink);overflow:hidden}
.cr-preview img.spr,.cr-preview svg{height:96%;width:auto;max-width:100%;object-fit:contain}
.cr-preview.pop img,.cr-preview.pop svg{animation:crPop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes crPop{from{transform:scale(.8) translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.cr-pick-info{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.cr-eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8A7FB8}
.cr-name{font-family:var(--f-display);font-size:clamp(1.4rem,4cqw,1.9rem);line-height:1.1;overflow-wrap:anywhere}
.cr-chip{align-self:flex-start;background:var(--ink);color:#fff;font-weight:800;font-size:.8rem;padding:2px 12px;border-radius:999px}
.cr-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cr-btns .btn.primary{flex:1 1 220px}
.cr-me{display:flex;align-items:center;gap:12px;padding:10px 14px}
.cr-me>div{flex:1;min-width:0;display:flex;flex-direction:column}
.cr-me-av{width:64px;height:64px;flex:none;border-radius:50%;overflow:hidden;border:3px solid var(--ink);background:linear-gradient(#BDE3FF,#FFE1EC)}
.cr-me-av img,.cr-me-av svg{width:100%;height:100%;object-fit:cover;object-position:50% 8%;transform:scale(1.2);transform-origin:50% 12%}
.kh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kh-card{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 14px 14px 18px;border:3px solid var(--ink);border-left:10px solid var(--c);border-radius:16px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .12s}
.kh-card b{font-family:var(--f-display);font-size:1.5rem;line-height:1}
.kh-card small{font-size:.86rem;color:var(--ink-soft);line-height:1.35}
.kh-card[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 22%,#fff);transform:translateY(-2px);box-shadow:0 4px 0 var(--ink),0 0 0 4px var(--c)}
.kh-check{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:#3DBE95;color:#fff;font-weight:900;display:none;place-items:center;border:2px solid #fff}
.kh-card[aria-pressed="true"] .kh-check{display:grid}
.kh-card.locked{background:repeating-linear-gradient(-45deg,#F3F2FA 0 8px,#E8E6F4 8px 16px)}
.kh-card .lock-ic{position:absolute;bottom:8px;right:10px;width:20px;opacity:.6}
.kh-card .lock-ic svg{width:20px;height:20px}
#c-note:not(:empty){margin-top:12px}
.big-go{font-size:1.1rem;padding:12px 20px}
@container app (max-width:560px){

  .cr-preview{width:100%;height:130px}.cr-pick .cr-chip{align-self:center}.cr-pick .cr-btns{flex-direction:column;margin-top:2px}.cr-pick .cr-btns .btn{flex:none;padding:8px 10px}

/* Bản đồ: điện thoại dọc thì nút điều khiển nằm thành thanh riêng dưới bản đồ, không che đồ vật */

.cr-me .cr-eyebrow{white-space:nowrap}

img.ic3d{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}

.m-mark{position:absolute;transform:translate(-50%,-50%);width:74px;height:74px;padding:0;border:0;background:none;cursor:pointer;z-index:2}
.mm-ic{position:absolute;inset:6px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,240,190,.85) 60%,rgba(255,215,120,.0) 72%);animation:markBob 2.4s ease-in-out infinite}

.m-mark.exit::before{border-color:rgba(160,210,255,.9);box-shadow:0 0 14px rgba(140,200,255,.8)}

.exam-grid{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}

/* ===================== v17: XP, đô, nhiệm vụ, cửa hàng, câu đố, NPC ===================== */

", "dapAn": "{a*c+b}/{c}", "bien": "a=1..9; c=3..9; b=1..8; dk=b<c && ucln(b,c)==1", "giaiThich": "{a} {b}/{c} = ({a} × {c} + {b})/{c} = {a*c+b}/{c}.", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Phân số", "loai": "DIEN", "cauHoi": "Tính: {a}/{c} + {b}/{d} = ? (viết dưới dạng phân số)", "A": "Kết quả: …", "B": "", "C": "", "D": "", "dapAn": "{a*d+b*c}/{c*d}", "bien": "c=2..9; d=2..9; a=1..8; b=1..8; dk=a<c && b<d && c!=d && ucln(a,c)==1 && ucln(b,d)==1", "giaiThich": "Quy đồng mẫu số rồi cộng: {a}/{c} + {b}/{d} = {a*d}/{c*d} + {b*c}/{c*d} = {a*d+b*c}/{c*d} (có thể rút gọn).", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Làm tròn số", "loai": "DIEN", "cauHoi": "Làm tròn số {x/1000} đến hàng phần trăm.", "A": "…", "B": "", "C": "", "D": "", "dapAn": "{round(x/10)/100}", "bien": "x=10123..99987; dk=x%10!=5 && x%10!=0 && floor(x/10)%10!=9", "giaiThich": "Xét chữ số hàng phần nghìn: bé hơn 5 thì giữ nguyên, từ 5 trở lên thì cộng 1 vào hàng phần trăm.", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Tính nhanh", "loai": "DIEN", "cauHoi": "Tính bằng cách thuận tiện: {a} × {b} + {a} × {c} − {a} × {b+c-10}", "A": "Kết quả: …", "B": "", "C": "", "D": "", "dapAn": "{a*10}", "bien": "a=[1.25,2.4,3.75,4.6,6.08]; b=4..9; c=6..9; dk=b+c>10", "giaiThich": "{a} × ({b} + {c} − {b+c-10}) = {a} × 10 = {a*10}.", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Dãy số", "loai": "DIEN", "cauHoi": "Cho dãy số: {s}; {s+d}; {s+2*d}; {s+3*d}; … Số hạng thứ {k} của dãy là bao nhiêu?", "A": "…", "B": "", "C": "", "D": "", "dapAn": "{s+(k-1)*d}", "bien": "s=[1.2,1.5,2.4,3.6]; d=[0.4,0.5,1.5,2.5]; k=10..20", "giaiThich": "Số hạng thứ {k} = {s} + ({k} − 1) × {d} = {s+(k-1)*d}.", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Số thập phân", "loai": "DIEN", "cauHoi": "Số thập phân gồm {a} chục, {b} đơn vị, {c} phần mười và {e} phần nghìn viết là:", "A": "…", "B": "", "C": "", "D": "", "dapAn": "{a*10 + b + c/10 + e/1000}", "bien": "a=1..9; b=0..9; c=1..9; e=1..9", "giaiThich": "{a} chục {b} đơn vị là {a*10+b}; {c} phần mười, 0 phần trăm, {e} phần nghìn là {c}0{e}. Số đó là {a*10 + b + c/10 + e/1000}.", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Chu vi, diện tích", "loai": "BAI", "cauHoi": "Cô Hạnh có một mảnh đất hình chữ nhật, chiều dài 40 m, chiều rộng 25 m. Cô trồng hoa trên 3/5 diện tích mảnh đất, phần còn lại cô lát gạch với giá 180 000 đồng cho 1 m². Hỏi cô Hạnh phải trả bao nhiêu tiền để lát gạch phần đất còn lại đó?", "A": "Diện tích mảnh đất: … m²", "B": "Diện tích lát gạch: … m²", "C": "Số tiền phải trả: … đồng", "D": "", "dapAn": "1000 // 400 // 72000000", "bien": "", "giaiThich": "Diện tích: 40 × 25 = 1000 (m²). Lát gạch: 1000 × 2/5 = 400 (m²). Tiền: 400 × 180 000 = 72 000 000 (đồng).", "dungCho": "CA_HAI", "maDe": "GHK1_DE1", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Tính nhanh", "loai": "BAI", "cauHoi": "a) Tính bằng cách thuận tiện: 13/8 × 5/7 − 5/8 × 5/7 + 2/7\nb) Một số thập phân có ba chữ số khác nhau. Chữ số hàng phần mười gấp đôi chữ số hàng phần trăm. Tổng các chữ số bằng 14. Số đó lớn hơn 2 nhưng nhỏ hơn 3. Tìm số đó.", "A": "a) Kết quả: …", "B": "b) Số đó là: …", "C": "", "D": "", "dapAn": "1 // 2,84", "bien": "", "giaiThich": "a) 5/7 × (13/8 − 5/8) + 2/7 = 5/7 × 1 + 2/7 = 1. b) Phần nguyên là 2; hai chữ số còn lại có tổng 12, hàng phần mười gấp đôi hàng phần trăm nên hàng phần trăm là 4, hàng phần mười là 8. Số đó là 2,84.", "dungCho": "CA_HAI", "maDe": "GHK1_DE1", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Chu vi, diện tích", "loai": "BAI", "cauHoi": "Một khu đất hình chữ nhật có chiều dài 1500 m, chiều rộng bằng 2/5 chiều dài. Người ta dành 1/3 diện tích khu đất để làm hồ nước, 3/10 diện tích để làm đường đi, phần còn lại để trồng cây.", "A": "a) Diện tích khu đất: … ha", "B": "b) Diện tích trồng cây: … m²", "C": "", "D": "", "dapAn": "90 // 330000", "bien": "", "giaiThich": "Chiều rộng: 1500 × 2/5 = 600 (m). Diện tích: 1500 × 600 = 900 000 (m²) = 90 ha. Phần trồng cây: 1 − 1/3 − 3/10 = 11/30; 900 000 × 11/30 = 330 000 (m²).", "dungCho": "CA_HAI", "maDe": "GHK1_DE2", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Tính nhanh", "loai": "BAI", "cauHoi": "a) Tính bằng cách thuận tiện: 11/9 × 6/5 − 2/9 × 6/5 + 4/5\nb) Cho bốn chữ số 1; 3; 4; 6. Viết các số thập phân có một chữ số ở phần nguyên, có đủ mặt cả bốn chữ số, mỗi chữ số xuất hiện một lần.", "A": "a) Kết quả: …", "B": "b) Viết được … số", "C": "Số lớn nhất: …", "D": "Số bé nhất: …", "dapAn": "2 // 24 // 6,431 // 1,346", "bien": "", "giaiThich": "a) 6/5 × (11/9 − 2/9) + 4/5 = 6/5 + 4/5 = 2. b) 4 cách chọn phần nguyên × 6 cách xếp phần thập phân = 24 số; lớn nhất 6,431; bé nhất 1,346.", "dungCho": "CA_HAI", "maDe": "GHK1_DE2", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Chu vi, diện tích", "loai": "BAI", "cauHoi": "Bác Lan xây dựng khu vườn kết hợp nhà kính trồng rau trên mảnh đất có diện tích 900 m². Biết khu nhà kính chiếm 2/5 diện tích mảnh đất, còn lại là khu trồng hoa. Bác Lan muốn dùng loại gạch có giá 250 000 đồng cho 1 m² để lát kín nền khu trồng hoa. Hỏi bác Lan cần trả bao nhiêu tiền?", "A": "Diện tích khu trồng hoa: … m²", "B": "Số tiền: … đồng", "C": "", "D": "", "dapAn": "540 // 135000000", "bien": "", "giaiThich": "Khu trồng hoa chiếm 1 − 2/5 = 3/5: 900 × 3/5 = 540 (m²). Tiền: 540 × 250 000 = 135 000 000 (đồng).", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Chu vi, diện tích", "loai": "BAI", "cauHoi": "Một khu đất hình chữ nhật có chiều dài 1200 m, chiều rộng bằng 2/3 chiều dài được quy hoạch làm khu du lịch. Người ta dành 1/5 diện tích đất để làm bãi đỗ ho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Toán có lời văn", "loai": "BAI", "cauHoi": "Cho số A và số B. Nếu đem A trừ đi 4,5 và B cộng với 4,5 thì được hai số bằng nhau. Nếu bớt ở cả hai số đi 0,4 thì được hai số mới có tỉ số là 4. Tìm hai số A và B.", "A": "A = …", "B": "B = …", "C": "", "D": "", "dapAn": "12,4 // 3,4", "bien": "", "giaiThich": "A − B = 9. Bớt cả hai số đi 0,4 thì hiệu vẫn là 9; số lớn gấp 4 lần số bé nên hiệu là 3 phần: 9 : 3 = 3. B − 0,4 = 3 → B = 3,4; A − 0,4 = 12 → A = 12,4.", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Chu vi, diện tích", "loai": "BAI", "cauHoi": "Một mảnh vườn hình chữ nhật có chiều dài 25 m, chiều rộng kém chiều dài 7 m. Người ta rào xung quanh mảnh vườn, chừa lại một lối ra vào rộng 3 m.", "A": "a) Cần … m hàng rào", "B": "b) Diện tích mảnh vườn: … m²", "C": "", "D": "", "dapAn": "83 // 450", "bien": "", "giaiThich": "Chiều rộng 18 m; chu vi (25 + 18) × 2 = 86 (m). a) 86 − 3 = 83 (m). b) 25 × 18 = 450 (m²).", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Chu vi, diện tích", "loai": "BAI", "cauHoi": "Một sân bóng hình chữ nhật có chiều dài 40 m, chiều rộng 25 m. Mỗi buổi sáng, bạn An chạy 3 vòng quanh sân.", "A": "Mỗi buổi sáng An chạy được: … m", "B": "Diện tích sân bóng: … m²", "C": "", "D": "", "dapAn": "390 // 1000", "bien": "", "giaiThich": "Chu vi: (40 + 25) × 2 = 130 (m). 3 vòng: 390 m. Diện tích: 40 × 25 = 1000 (m²).", "dungCho": "CA_HAI", "maDe": "", "hinh": "", "giuThuTu": ""}, {"khoi": "5", "mon": "Toán", "chuDe": "Chu vi, diện tích", "loai": "BAI", "cauHoi": "Mẹ may viền ren xung quanh một chiếc khăn trải bàn hình vuông có cạnh 9 dm. Mỗi đề-xi-mét ren giá 2 000 đồng.", "A": "Tiền mua ren: … đồng", "B": "Diện tích chiếc khăn: … dm²", "C": "", "D": "", "dapAn": "72000 // 81", "bien": "", "giaiThich": "Chu vi: 9 × 4 = 36 (dm). Tiền: 36 × 2 000 = 72 000 ( /* ---------- Ảnh bìa (key art) ---------- */
function keyArt() {
  const g = nid('ka');
  let ring = '';
  for (let i = 0; i < 60; i++) {
    const a = i * Math.PI / 30, big = i % 5 === 0;
    ring += `<line x1="${1080 + 330 * Math.sin(a)}" y1="${400 - 330 * Math.cos(a)}" x2="${1080 + (big ? 296 : 314) * Math.sin(a)}" y2="${400 - (big ? 296 : 314) * Math.cos(a)}" stroke="#FFE3A0" stroke-opacity="${big ? .8 : .4}" stroke-width="${big ? 6 : 2}" stroke-linecap="round"/>`;
  }
  const roman = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'].map((t, i) => { const a = i * Math.PI / 6; return `<text x="${1080 + 258 * Math.sin(a)}" y="${400 - 258 * Math.cos(a) + 12}" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#FFE3A0" fill-opacity=".75">${t}</text>`; }).join('');
  let petals = '';
  for (let i = 0; i < 18; i++) {
    const x = (i * 97) % 1600, y = (i * 53) % 700, d = 9 + (i % 5) * 2.2;
    petals += `<ellipse cx="${x}" cy="${y}" rx="9" ry="5" fill="${i % 3 ? '#FF5A47' : '#FF8A5B'}" opacity=".85"><animateTransform attributeName="transform" type="translate" values="0 -60; 120 820" dur="${d}s" begin="-${i * 0.9}s" repeatCount="indefinite"/></ellipse>`;
  }
  let stars = '';
  for (let i = 0; i < 40; i++) stars += `<circle cx="${(i * 137) % 1600}" cy="${(i * 71) % 380}" r="${i % 4 ? 1.6 : 2.6}" fill="#fff" opacity="${.3 + (i % 5) * .12}"/>`;
  const boy = playerArt({ gender: 'nam', hair: 0 }, 'quyet');
  const girl = playerArt({ gender: 'nu', hair: 1 }, 'cuoi');
  const clock = clockSvg({ expr: 'vui' });
  const emb = (svg, x, y, w, r) => svg.replace('<svg ', `<svg x="${x}" y="${y}" width="${w}" height="${Math.round(w * r)}" `);
  return `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="${g}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C55"/><stop offset=".5" stop-color="#5A3F94"/><stop offset=".78" stop-color="#E9839A"/><stop offset="1" stop-color="#FFC48A"/></linearGradient>
    <radialGradient id="${g}g" cx="50%" cy="50%"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".55"/><stop offset=".6" stop-color="#FFB86B" stop-opacity=".12"/><stop offset="1" stop-color="#FFB86B" stop-opacity="0"/></radialGradient>
    <linearGradient id="${g}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2466"/><stop offset="1" stop-color="#191446"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#${g}s)"/>${stars}
  <circle cx="1080" cy="400" r="440" fill="url(#${g}g)"/>
  <g class="ka-ring"><circle cx="1080" cy="400" r="340" fill="none" stroke="#FFE3A0" stroke-opacity=".55" stroke-width="5"/><circle cx="1080" cy="400" r="290" fill="none" stroke="#FFE3A0" stroke-opacity=".25" stroke-width="2"/>${ring}${roman}</g>
  <g class="ka-hands" style="transform-origin:1080px 400px"><path d="M1080 400 L1068 190 L1080 140 L1092 190Z" fill="#FFE3A0" fill-opacity=".8"/><path d="M1080 400 L1250 300 L1276 286 L1262 312Z" fill="#FF9AA8" fill-opacity=".8"/></g>
  <circle cx="1080" cy="400" r="14" fill="#FFE3A0"/>
  <path d="M0 660 L120 620 L120 560 L260 560 L260 600 L420 600 L420 540 L600 540 L600 620 L760 640 L1600 650 L1600 900 L0 900Z" fill="url(#${g}f)"/>
  ${Array.from({ length: 6 }, (_, i) => `<rect x="${140 + i * 50}" y="${578}" width="22" height="26" fill="#FFD98A" opacity=".55"/><rect x="${440 + i * 26}" y="${560}" width="14" height="20" fill="#FFD98A" opacity=".45"/>`).join('')}
  <path d="M60 900 C50 760 70 690 90 640 L118 640 C104 700 112 800 120 900Z" fill="#2A1A3A"/>
  <ellipse cx="110" cy="560" rx="220" ry="130" fill="#2E5B3A"/><ellipse cx="60" cy="520" rx="120" ry="70" fill="#3A6E45"/>
  ${Array.from({ length: 26 }, (_, i) => `<circle cx="${-60 + (i * 47) % 360}" cy="${470 + (i * 31) % 160}" r="${12 + i % 3 * 4}" fill="${i % 2 ? '#E8392F' : '#FF6A4D'}"/>`).join('')}
  <ellipse cx="760" cy="880" rx="520" ry="60" fill="#120E36" opacity=".6"/>
  <ellipse cx="700" cy="826" rx="300" ry="34" fill="#FFB86B" opacity=".16"/>
  ${emb(girl, 440, 400, 300, 330 / 240)}
  ${emb(boy, 680, 352, 340, 330 / 240)}
  <g class="ka-float">${emb(clock, 930, 240, 210, 250 / 240)}</g>
  ${petals}
</svg>`;
}

const TEACHERS = [
